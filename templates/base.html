<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Media Compressor & Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- ============================================================
         DUAL THEMES: classic (original) + modern (animated).
         The early script below disables whichever is not active
         BEFORE first paint, so there is no flash of wrong UI.
         ============================================================ -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" id="theme-classic">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-modern.css') }}" id="theme-modern">
    <script>
        (function () {
            var theme = 'classic';
            try { theme = localStorage.getItem('ui-theme') || 'classic'; } catch (e) {}
            if (theme !== 'modern' && theme !== 'classic') theme = 'classic';
            document.documentElement.dataset.theme = theme;
            var classic = document.getElementById('theme-classic');
            var modern  = document.getElementById('theme-modern');
            if (classic) classic.disabled = (theme === 'modern');
            if (modern)  modern.disabled  = (theme !== 'modern');
        })();
    </script>
</head>
<body>
<div class="container">

    <!-- ========== System Stats Meter ========== -->
    <div class="sys-stats" id="sysStats">
        <div class="sys-stat" title="CPU usage">
            <i class="fas fa-microchip"></i>
            <span class="sys-label">CPU</span>
            <div class="sys-bar"><div class="sys-fill sys-cpu" id="cpuFill"></div></div>
            <span class="sys-value" id="cpuValue">–</span>
        </div>
        <div class="sys-stat" title="RAM usage">
            <i class="fas fa-memory"></i>
            <span class="sys-label">RAM</span>
            <div class="sys-bar"><div class="sys-fill sys-ram" id="ramFill"></div></div>
            <span class="sys-value" id="ramValue">–</span>
        </div>
        <div class="sys-stat" title="Disk usage">
            <i class="fas fa-hdd"></i>
            <span class="sys-label">Disk</span>
            <div class="sys-bar"><div class="sys-fill sys-disk" id="diskFill"></div></div>
            <span class="sys-value" id="diskValue">–</span>
        </div>
        <div class="sys-stat sys-net" title="Download speed">
            <i class="fas fa-arrow-down" style="color:#4ade80;"></i>
            <span class="sys-label">Down</span>
            <span class="sys-value-net" id="downValue">0 B/s</span>
        </div>
        <div class="sys-stat sys-net" title="Upload speed">
            <i class="fas fa-arrow-up" style="color:#f59e0b;"></i>
            <span class="sys-label">Up</span>
            <span class="sys-value-net" id="upValue">0 B/s</span>
        </div>

        <label class="sys-stat sys-toggle" title="Pause thumbnail generation (saves CPU)">
            <input type="checkbox" id="pauseThumbnails" style="accent-color: #ef4444;">
            <i class="fas fa-images" id="thumbIcon"></i>
            <span class="sys-label" style="min-width:auto;">Pause&nbsp;Thumbs</span>
        </label>

        <!-- ========== UI Theme Switcher ========== -->
        <button id="themeToggleBtn"
                class="sys-stat sys-toggle"
                type="button"
                title="Switch UI theme"
                style="background:transparent; border:1px solid rgba(95,143,224,0.3);
                       color:#b0c4ff; padding:4px 12px; border-radius:1rem; cursor:pointer;
                       font-size:0.78rem; font-family:inherit;
                       display:inline-flex; align-items:center; gap:6px;">
            <i class="fas fa-wand-magic-sparkles" id="themeIcon"></i>
            <span id="themeLabel" style="min-width:auto;">Modern</span>
        </button>
    </div>

    <!-- ========== Header ========== -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <h1><i class="fas fa-video"></i> Media Compressor &amp; Manager</h1>
        <div style="margin-top: 0.5rem; opacity: 0.7;">Bulk download, encode, and organize your media</div>
    </div>

    {% import '_features_macro.html' as features %}
    <div class="tabs">
        {{ features.render_tabs() }}
    </div>
    {{ features.render_panes() }}

    <div class="card">
        <h2><i class="fas fa-tasks"></i> Active Tasks</h2>
        <div id="tasksContainer" class="task-list empty-state">No active tasks.</div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

<!-- ========== System Stats + Thumbnail Toggle ========== -->
<script>
window.thumbnailsEnabled = true;

(function() {
    const cpuFill  = document.getElementById('cpuFill');
    const ramFill  = document.getElementById('ramFill');
    const diskFill = document.getElementById('diskFill');
    const cpuValue = document.getElementById('cpuValue');
    const ramValue = document.getElementById('ramValue');
    const diskValue= document.getElementById('diskValue');
    const downValue= document.getElementById('downValue');
    const upValue  = document.getElementById('upValue');

    function colorFor(pct) {
        if (pct < 50) return 'linear-gradient(90deg, #4ade80, #86efac)';
        if (pct < 80) return 'linear-gradient(90deg, #facc15, #fde68a)';
        return 'linear-gradient(90deg, #ef4444, #fca5a5)';
    }
    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }
    function formatSpeed(bps) {
        if (bps < 1024) return bps + ' B/s';
        if (bps < 1024 * 1024) return (bps / 1024).toFixed(1) + ' KB/s';
        if (bps < 1024 * 1024 * 1024) return (bps / (1024 * 1024)).toFixed(1) + ' MB/s';
        return (bps / (1024 * 1024 * 1024)).toFixed(2) + ' GB/s';
    }

    async function updateStats() {
        try {
            const resp = await fetch('/system_stats');
            const data = await resp.json();
            cpuFill.style.width = data.cpu + '%';
            cpuFill.style.background = colorFor(data.cpu);
            cpuValue.textContent = data.cpu + '%';
            ramFill.style.width = data.ram + '%';
            ramFill.style.background = colorFor(data.ram);
            ramValue.textContent = data.ram + '%';
            if (data.ram_used && data.ram_total) {
                ramValue.title = `${formatBytes(data.ram_used)} / ${formatBytes(data.ram_total)}`;
            }
            diskFill.style.width = data.disk + '%';
            diskFill.style.background = colorFor(data.disk);
            diskValue.textContent = data.disk + '%';
            downValue.textContent = formatSpeed(data.net_down || 0);
            upValue.textContent = formatSpeed(data.net_up || 0);
            downValue.style.color = (data.net_down > 1024 * 1024) ? '#86efac'
                                   : (data.net_down > 0) ? '#d1fae5' : '#8a9bc0';
            upValue.style.color = (data.net_up > 1024 * 1024) ? '#fde68a'
                                 : (data.net_up > 0) ? '#fef3c7' : '#8a9bc0';
        } catch (e) {
            console.error('system_stats error:', e);
        }
    }
    updateStats();
    setInterval(updateStats, 2000);
})();

// ============================================================
// Thumbnail pause toggle
// ============================================================
(function() {
    const cb = document.getElementById('pauseThumbnails');
    const icon = document.getElementById('thumbIcon');
    if (!cb) return;

    function setIcon(paused) {
        if (!icon) return;
        icon.style.color = paused ? '#ef4444' : '#5f8fe0';
        icon.title = paused ? 'Thumbnails paused' : 'Thumbnails enabled';
    }

    fetch('/thumbnail/settings')
        .then(r => r.json())
        .then(data => {
            cb.checked = !data.enabled;
            setIcon(!data.enabled);
            window.thumbnailsEnabled = data.enabled;
            window.dispatchEvent(new Event('thumbnailsToggled'));
        })
        .catch(err => console.warn('Could not load thumbnail settings:', err));

    cb.addEventListener('change', async function() {
        const enabled = !cb.checked;
        try {
            const resp = await fetch('/thumbnail/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `enabled=${enabled}`
            });
            const data = await resp.json();
            setIcon(!data.enabled);
            window.thumbnailsEnabled = data.enabled;
            window.dispatchEvent(new Event('thumbnailsToggled'));
            if (typeof showToast === 'function') {
                showToast(data.enabled ? 'Thumbnails enabled' : 'Thumbnails paused');
            }
        } catch (err) {
            console.error('Failed to update thumbnail setting:', err);
            cb.checked = !cb.checked;
            setIcon(cb.checked);
        }
    });
})();
</script>

<!-- ========== Theme Switcher + Modern UI polish ========== -->
<script>
/* ========================================================
   Theme Switcher — flips between style.css and style-modern.css
   ======================================================== */
(function () {
    var btn   = document.getElementById('themeToggleBtn');
    var icon  = document.getElementById('themeIcon');
    var label = document.getElementById('themeLabel');
    if (!btn) return;

    function updateUI(theme) {
        if (theme === 'modern') {
            icon.className    = 'fas fa-palette';
            label.textContent = 'Classic';
            btn.title         = 'Switch to Classic UI';
        } else {
            icon.className    = 'fas fa-wand-magic-sparkles';
            label.textContent = 'Modern';
            btn.title         = 'Switch to Animated Modern UI';
        }
    }

    updateUI(document.documentElement.dataset.theme || 'classic');

    btn.addEventListener('click', function () {
        var next = (document.documentElement.dataset.theme === 'modern')
                   ? 'classic' : 'modern';

        /* Quick fade while swapping stylesheets */
        document.body.style.transition = 'opacity 0.15s ease';
        document.body.style.opacity    = '0.7';

        setTimeout(function () {
            document.documentElement.dataset.theme = next;
            var classic = document.getElementById('theme-classic');
            var modern  = document.getElementById('theme-modern');
            if (classic) classic.disabled = (next === 'modern');
            if (modern)  modern.disabled  = (next !== 'modern');
            try { localStorage.setItem('ui-theme', next); } catch (e) {}
            updateUI(next);

            document.body.style.opacity = '1';
            setTimeout(function () { document.body.style.transition = ''; }, 200);

            if (typeof showToast === 'function') {
                showToast(next === 'modern'
                    ? '✨ Modern UI enabled'
                    : '🎨 Classic UI restored');
            }
        }, 150);
    });
})();

/* ========================================================
   Modern-UI-only polish:
     • cursor spotlight on cards
     • click ripple on buttons/tabs
   Both auto-disable when the classic theme is active.
   ======================================================== */
(function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    /* --- Cursor spotlight --- */
    var pending = null;
    document.addEventListener('mousemove', function (e) {
        if (document.documentElement.dataset.theme !== 'modern') return;
        if (pending) return;
        pending = requestAnimationFrame(function () {
            pending = null;
            var el = e.target.closest('.card, .file-card, .task-card');
            if (!el) return;
            var r = el.getBoundingClientRect();
            el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            el.style.setProperty('--my', (e.clientY - r.top)  + 'px');
        });
    }, { passive: true });

    /* --- Click ripple --- */
    document.addEventListener('pointerdown', function (e) {
        if (document.documentElement.dataset.theme !== 'modern') return;
        var el = e.target.closest('button, .tab-btn, .file-actions button, .file-actions a');
        if (!el) return;
        var r    = el.getBoundingClientRect();
        var size = Math.max(r.width, r.height);
        var rip  = document.createElement('span');
        rip.className    = 'ripple';
        rip.style.width  = rip.style.height = size + 'px';
        rip.style.left   = (e.clientX - r.left - size / 2) + 'px';
        rip.style.top    = (e.clientY - r.top  - size / 2) + 'px';
        el.appendChild(rip);
        setTimeout(function () { rip.remove(); }, 650);
    }, { passive: true });
})();
</script>
</body>
</html>
