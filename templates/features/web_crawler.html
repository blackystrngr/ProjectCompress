<div class="card">
    <h2><i class="fas fa-spider"></i> Recursive Domain Crawler</h2>
    <p style="color:#8b9dc3">Grok‑style low‑bandwidth real‑time crawler – results saved in real‑time</p>

    <form id="crawlerForm">
        <input type="text" id="startUrl" placeholder="https://example.com" required style="flex:1">
        <input type="number" id="maxPages" value="0" placeholder="Max pages (0=unlimited)">
        <input type="number" id="maxDepth" value="3" min="1" max="8">
        <button type="submit" class="primary">Start Crawl</button>
        <button type="button" id="cancelBtn" class="danger" style="display:none">Cancel</button>
    </form>

    <div id="status" class="help-text"></div>

    <div style="margin:15px 0; display:flex; gap:15px; font-size:0.9rem; flex-wrap:wrap;">
        <span>Pages: <b id="pages">0</b></span>
        <span>Domains: <b id="count">0</b></span>
        <span>URLs: <b id="urlsCount">0</b></span>
        <span>Current: <span id="path" style="color:#7cc3ff">-</span></span>
    </div>

    <button id="copyBtn" style="display:none">Copy All Domains</button>
    <button id="downloadBtn" style="display:none">Download Domains</button>

    <div id="domainList" style="margin-top:15px; max-height:500px; overflow:auto; background:#1a2033; padding:12px; border-radius:8px; font-family:monospace; font-size:0.85rem;"></div>

    <hr style="margin:1.5rem 0; border-color:#2a3248;">

    <!-- File management -->
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;"><i class="fas fa-files"></i> Saved Domain Files</h3>
        <button id="refreshFilesBtn" class="primary"><i class="fas fa-sync-alt"></i> Refresh List</button>
    </div>
    <div id="fileList" class="file-grid empty-state" style="margin-top:1rem;">No domain files found.</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ---------- DOM refs ----------
    const form = document.getElementById('crawlerForm');
    const statusEl = document.getElementById('status');
    const domainList = document.getElementById('domainList');
    const fileListDiv = document.getElementById('fileList');
    const cancelBtn = document.getElementById('cancelBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const refreshFilesBtn = document.getElementById('refreshFilesBtn');

    let domains = new Set();
    let currentTaskId = null;
    let es = null;

    // ---------- Form submission ----------
    form.addEventListener('submit', async function(event) {
        event.preventDefault();   // critical – prevents page reload
        console.log('Form submitted – starting crawler');

        domains.clear();
        domainList.innerHTML = '';
        copyBtn.style.display = 'none';
        downloadBtn.style.display = 'none';

        const startUrl = document.getElementById('startUrl').value.trim();
        const maxPages = document.getElementById('maxPages').value;
        const maxDepth = document.getElementById('maxDepth').value;

        if (!startUrl) {
            statusEl.innerHTML = '❌ Please enter a start URL.';
            return;
        }

        try {
            const resp = await fetch('/crawler/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    start_url: startUrl,
                    max_pages: maxPages,
                    max_depth: maxDepth
                })
            });
            const data = await resp.json();
            console.log('Crawler start response:', data);

            if (data.task_id) {
                currentTaskId = data.task_id;
                cancelBtn.style.display = 'inline-block';
                connectStream();
                statusEl.innerHTML = '⏳ Crawl started – waiting for updates...';
            } else {
                statusEl.innerHTML = '❌ Error: ' + (data.error || 'Unknown error');
            }
        } catch (err) {
            console.error('Fetch error:', err);
            statusEl.innerHTML = '❌ Error: ' + err.message;
        }

        return false; // extra safety
    });

    // ---------- SSE connection ----------
    function connectStream() {
        if (es) {
            es.close();
            es = null;
        }
        console.log('Connecting to SSE stream for task:', currentTaskId);
        es = new EventSource(`/crawler/stream/${currentTaskId}`);

        es.addEventListener('update', function(e) {
            try {
                const p = JSON.parse(e.data);
                console.log('SSE update:', p);
                p.domains.forEach(d => domains.add(d));

                document.getElementById('pages').textContent = p.pages || 0;
                document.getElementById('count').textContent = domains.size;
                document.getElementById('urlsCount').textContent = p.urls_count || 0;
                document.getElementById('path').textContent = p.path || '/';
                statusEl.textContent = `Crawling... ${p.progress || 0}%`;

                if (p.domains.length) renderDomains();
            } catch (err) {
                console.error('Error processing SSE update:', err);
            }
        });

        es.addEventListener('done', function() {
            console.log('SSE done event');
            statusEl.innerHTML = `✅ Completed — ${domains.size} domains found`;
            cancelBtn.style.display = 'none';
            copyBtn.style.display = 'inline-block';
            downloadBtn.style.display = 'inline-block';
            loadFileList();
            if (es) es.close();
        });

        es.addEventListener('cancelled', function() {
            console.log('SSE cancelled event');
            statusEl.innerHTML = '⛔ Cancelled by user';
            cancelBtn.style.display = 'none';
            if (es) es.close();
        });

        es.onerror = function(e) {
            // SSE connections may log errors for keep-alive pings; ignore if we have a task
            console.warn('SSE error (may be normal):', e);
        };
    }

    // ---------- Render domains ----------
    function renderDomains() {
        let html = '';
        domains.forEach(d => html += `<div>${d}</div>`);
        domainList.innerHTML = html;
    }

    // ---------- Cancel ----------
    cancelBtn.addEventListener('click', async function() {
        if (currentTaskId) {
            try {
                await fetch(`/crawler/cancel/${currentTaskId}`, { method: 'POST' });
                statusEl.innerHTML = '⛔ Cancellation requested...';
                cancelBtn.style.display = 'none';
            } catch (err) {
                console.error('Cancel error:', err);
            }
        }
    });

    // ---------- Copy ----------
    copyBtn.addEventListener('click', function() {
        if (domains.size === 0) {
            alert('No domains to copy');
            return;
        }
        const text = [...domains].join('\n');
        navigator.clipboard.writeText(text)
            .then(() => alert('Copied!'))
            .catch(() => {
                // fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Copied!');
            });
    });

    // ---------- Download current result ----------
    downloadBtn.addEventListener('click', function() {
        if (currentTaskId) {
            window.open(`/crawler/download_domains/${currentTaskId}`);
        }
    });

    // ---------- File list ----------
    async function loadFileList() {
        try {
            const resp = await fetch('/crawler/list_files');
            const files = await resp.json();
            if (files.length === 0) {
                fileListDiv.innerHTML = '<div class="empty-state">No domain files saved yet.</div>';
                return;
            }
            let html = '';
            files.forEach(f => {
                const sizeStr = f.size_str || formatBytes(f.size);
                const mtime = new Date(f.mtime * 1000).toLocaleString();
                html += `<div class="file-card">
                            <div class="file-name"><i class="fas fa-file-alt"></i> ${escapeHtml(f.name)}</div>
                            <div class="file-size">${sizeStr} · ${mtime}</div>
                            <div class="file-actions">
                                <a href="/crawler/download_domains_by_filename?filename=${encodeURIComponent(f.path)}" target="_blank"><i class="fas fa-download"></i> Download</a>
                                <button class="view-file-btn" data-filename="${escapeHtml(f.path)}"><i class="fas fa-eye"></i> View</button>
                            </div>
                        </div>`;
            });
            fileListDiv.innerHTML = html;
            document.querySelectorAll('.view-file-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const name = this.dataset.filename;
                    window.open(`/crawler/view/${encodeURIComponent(name)}`, '_blank');
                });
            });
        } catch (err) {
            console.error('File list error:', err);
            fileListDiv.innerHTML = `<div class="empty-state" style="color:#ff8a8a;">Error loading files: ${err.message}</div>`;
        }
    }

    refreshFilesBtn.addEventListener('click', loadFileList);

    // ---------- Helpers ----------
    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        const val = (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0);
        return val + ' ' + units[i];
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ---------- Initial load ----------
    loadFileList();
});
</script>
