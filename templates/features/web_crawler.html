<div class="card">
    <h2><i class="fas fa-spider"></i> Web Crawler / Link Extractor</h2>
    <p>Starting from a URL, recursively crawl pages and extract all unique links and domains.</p>
    <form id="crawlerForm">
        <div class="input-group">
            <input type="text" id="startUrl" placeholder="https://example.com" required>
            <input type="number" id="maxPages" placeholder="Max pages" value="100" min="1" max="5000" style="width:120px;">
            <input type="number" id="maxDepth" placeholder="Max depth" value="2" min="1" max="5" style="width:120px;">
            <button type="submit" class="primary"><i class="fas fa-play"></i> Start Crawl</button>
        </div>
        <div id="crawlerStatus" class="help-text"></div>
    </form>

    <div id="crawlerResults">
        <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
            <span><strong>Current Directory:</strong> <span id="currentDir" style="color:#80b3ff;">-</span></span>
            <span><strong>Pages visited:</strong> <span id="pagesVisited">0</span></span>
            <span><strong>Unique URLs:</strong> <span id="urlCount">0</span></span>
            <span><strong>Unique domains:</strong> <span id="domainCount">0</span></span>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
            <button id="copyDomainsBtn" class="primary" style="display:none;"><i class="fas fa-copy"></i> Copy Domains</button>
            <button id="downloadDomainsBtn" class="primary" style="display:none;"><i class="fas fa-download"></i> Download Domains</button>
            <button id="downloadUrlsBtn" class="primary" style="display:none;"><i class="fas fa-download"></i> Download URLs</button>
            <button id="showSavedBtn" class="primary"><i class="fas fa-folder-open"></i> Show Saved Domains</button>
        </div>

        <div style="display:flex; gap:2rem; flex-wrap:wrap;">
            <div style="flex:1; min-width:300px;">
                <h4>Discovered URLs</h4>
                <div id="urlList" style="max-height:400px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem;">
                    <div class="empty-state">No URLs yet.</div>
                </div>
            </div>
            <div style="flex:1; min-width:200px;">
                <h4>Domains</h4>
                <div id="domainList" style="max-height:400px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem;">
                    <div class="empty-state">No domains yet.</div>
                </div>
            </div>
        </div>

        <!-- Saved domain files section -->
        <div id="savedFilesSection" style="margin-top:1rem; display:none;">
            <h4>Saved Domain Files</h4>
            <div id="savedFilesList" style="max-height:200px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem;">
                <div class="empty-state">No saved domain files.</div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('crawlerForm');
    const startUrlInput = document.getElementById('startUrl');
    const maxPagesInput = document.getElementById('maxPages');
    const maxDepthInput = document.getElementById('maxDepth');
    const statusDiv = document.getElementById('crawlerStatus');
    const currentDirSpan = document.getElementById('currentDir');
    const pagesVisitedSpan = document.getElementById('pagesVisited');
    const urlCountSpan = document.getElementById('urlCount');
    const domainCountSpan = document.getElementById('domainCount');
    const urlListDiv = document.getElementById('urlList');
    const domainListDiv = document.getElementById('domainList');
    const copyDomainsBtn = document.getElementById('copyDomainsBtn');
    const downloadDomainsBtn = document.getElementById('downloadDomainsBtn');
    const downloadUrlsBtn = document.getElementById('downloadUrlsBtn');
    const showSavedBtn = document.getElementById('showSavedBtn');
    const savedFilesSection = document.getElementById('savedFilesSection');
    const savedFilesList = document.getElementById('savedFilesList');

    let currentTaskId = null;
    let pollInterval = null;

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const startUrl = startUrlInput.value.trim();
        if (!startUrl) { showToast('Enter a start URL', true); return; }
        const maxPages = parseInt(maxPagesInput.value) || 100;
        const maxDepth = parseInt(maxDepthInput.value) || 2;

        try {
            const resp = await fetch('/crawler/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `start_url=${encodeURIComponent(startUrl)}&max_pages=${maxPages}&max_depth=${maxDepth}`
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            currentTaskId = data.task_id;
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Crawling started...';
            urlListDiv.innerHTML = '<div class="empty-state">Crawling...</div>';
            domainListDiv.innerHTML = '<div class="empty-state">Crawling...</div>';
            pagesVisitedSpan.textContent = '0';
            urlCountSpan.textContent = '0';
            domainCountSpan.textContent = '0';
            currentDirSpan.textContent = '-';
            copyDomainsBtn.style.display = 'none';
            downloadDomainsBtn.style.display = 'none';
            downloadUrlsBtn.style.display = 'none';
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollCrawler, 2000);
        } catch (err) {
            showToast(err.message, true);
        }
    });

    async function pollCrawler() {
        if (!currentTaskId) return;
        try {
            const resp = await fetch(`/crawler/status/${currentTaskId}`);
            const data = await resp.json();
            if (data.error) {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">Error: ${data.error}</span>`;
                return;
            }
            const progress = data.progress || 0;
            const status = data.status;
            const totalPages = data.total_pages || 0;
            const urls = data.discovered_urls || [];
            const domains = data.domains || [];
            const currentDir = data.current_directory || '-';

            currentDirSpan.textContent = currentDir;
            pagesVisitedSpan.textContent = totalPages;
            urlCountSpan.textContent = urls.length;
            domainCountSpan.textContent = domains.length;

            if (urls.length > 0) {
                let html = '';
                urls.slice(0, 200).forEach(u => {
                    html += `<div style="font-size:0.8rem; padding:2px 0; border-bottom:1px solid #2a3248; word-break:break-all;">${escapeHtml(u)}</div>`;
                });
                if (urls.length > 200) html += `<div style="color:#aaa; font-size:0.8rem;">... and ${urls.length - 200} more</div>`;
                urlListDiv.innerHTML = html;
            } else {
                urlListDiv.innerHTML = '<div class="empty-state">No URLs yet.</div>';
            }

            if (domains.length > 0) {
                let html = '';
                domains.forEach(d => {
                    html += `<div style="font-size:0.8rem; padding:2px 0; border-bottom:1px solid #2a3248;">${escapeHtml(d)}</div>`;
                });
                domainListDiv.innerHTML = html;
            } else {
                domainListDiv.innerHTML = '<div class="empty-state">No domains yet.</div>';
            }

            if (status === 'done') {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `✅ Crawling completed. Found ${urls.length} unique URLs across ${domains.length} domains.`;
                copyDomainsBtn.style.display = 'inline-flex';
                downloadDomainsBtn.style.display = 'inline-flex';
                downloadUrlsBtn.style.display = 'inline-flex';
                downloadUrlsBtn.onclick = () => {
                    window.open(`/crawler/download_urls/${currentTaskId}`, '_blank');
                };
                downloadDomainsBtn.onclick = () => {
                    window.open(`/crawler/download_domains/${currentTaskId}`, '_blank');
                };
                copyDomainsBtn.onclick = () => {
                    const text = domains.join('\n');
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`Copied ${domains.length} domains to clipboard`);
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showToast('Domains copied (fallback)');
                    });
                };
            } else if (status === 'error') {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">❌ Error: ${data.error_msg}</span>`;
            } else {
                statusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Crawling... (${progress}%, ${totalPages} pages visited)`;
            }
        } catch (err) {
            console.error(err);
        }
    }

    // Show saved domain files
    showSavedBtn.addEventListener('click', async function() {
        try {
            const resp = await fetch('/crawler/list_domain_files');
            const files = await resp.json();
            if (files.length === 0) {
                savedFilesList.innerHTML = '<div class="empty-state">No saved domain files found.</div>';
            } else {
                let html = '';
                files.forEach(f => {
                    const sizeStr = f.size > 1024 ? (f.size/1024).toFixed(1) + ' KB' : f.size + ' B';
                    html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #2a3248;">
                                <span>${escapeHtml(f.name)} (${sizeStr})</span>
                                <a href="/download/${encodeURIComponent(f.path)}" class="primary" style="padding:0.2rem 0.6rem; font-size:0.7rem;"><i class="fas fa-download"></i> Download</a>
                            </div>`;
                });
                savedFilesList.innerHTML = html;
            }
            savedFilesSection.style.display = 'block';
        } catch (err) {
            showToast('Failed to load saved files', true);
        }
    });
})();
</script>
