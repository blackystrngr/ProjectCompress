<div class="card">
    <h2><i class="fas fa-globe"></i> Domain Directory Crawler</h2>
    <p>Extract all internal URLs and directory structure from a single domain (e.g., sltmobitel.lk).</p>
    <form id="crawlerForm">
        <div class="input-group">
            <input type="text" id="startUrl" placeholder="https://sltmobitel.lk" required>
            <input type="number" id="maxPages" placeholder="Max pages" value="200" min="1" max="5000" style="width:120px;">
            <input type="number" id="maxDepth" placeholder="Max depth" value="3" min="1" max="10" style="width:120px;">
            <button type="submit" class="primary"><i class="fas fa-play"></i> Start Crawl</button>
        </div>
        <div id="crawlerStatus" class="help-text"></div>
    </form>

    <div id="crawlerResults">
        <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
            <span><strong>Domain:</strong> <span id="targetDomain">-</span></span>
            <span><strong>Current:</strong> <span id="currentUrl" style="color:#80b3ff;">-</span></span>
            <span><strong>Pages visited:</strong> <span id="pagesVisited">0</span></span>
            <span><strong>Internal URLs:</strong> <span id="urlCount">0</span></span>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
            <button id="downloadUrlsBtn" class="primary" style="display:none;"><i class="fas fa-download"></i> Download URLs</button>
            <button id="downloadDirsBtn" class="primary" style="display:none;"><i class="fas fa-folder-tree"></i> Download Directories</button>
            <button id="showFilesBtn" class="primary"><i class="fas fa-folder-open"></i> Show Saved Files</button>
        </div>

        <div style="display:flex; gap:2rem; flex-wrap:wrap;">
            <div style="flex:1; min-width:300px;">
                <h4>Internal URLs</h4>
                <div id="urlList" style="max-height:400px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem;">
                    <div class="empty-state">No URLs yet.</div>
                </div>
            </div>
            <div style="flex:1; min-width:250px;">
                <h4>Directory Structure</h4>
                <div id="dirList" style="max-height:400px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem; font-family:monospace; font-size:0.8rem;">
                    <div class="empty-state">No directories yet.</div>
                </div>
            </div>
        </div>

        <div id="savedFilesSection" style="margin-top:1rem; display:none;">
            <h4>Saved Files</h4>
            <div id="savedFilesList" style="max-height:200px; overflow-y:auto; background:#1e2438; border-radius:1rem; padding:0.5rem;">
                <div class="empty-state">No saved files.</div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('crawlerForm');
    const startUrlInput = document.getElementById('startUrl');
    const maxPagesInput = document.getElementById('maxPages');
    const maxDepthInput = document.getElementById('maxDepth');
    const statusDiv = document.getElementById('crawlerStatus');
    const targetDomainSpan = document.getElementById('targetDomain');
    const currentUrlSpan = document.getElementById('currentUrl');
    const pagesVisitedSpan = document.getElementById('pagesVisited');
    const urlCountSpan = document.getElementById('urlCount');
    const urlListDiv = document.getElementById('urlList');
    const dirListDiv = document.getElementById('dirList');
    const downloadUrlsBtn = document.getElementById('downloadUrlsBtn');
    const downloadDirsBtn = document.getElementById('downloadDirsBtn');
    const showFilesBtn = document.getElementById('showFilesBtn');
    const savedFilesSection = document.getElementById('savedFilesSection');
    const savedFilesList = document.getElementById('savedFilesList');

    let currentTaskId = null;
    let pollInterval = null;

    // Helper: build directory tree display
    function renderDirectoryTree(urls) {
        const tree = {};
        urls.forEach(url => {
            const parsed = new URL(url);
            const path = parsed.pathname || '/';
            const parts = path.split('/').filter(p => p);
            let current = tree;
            parts.forEach(part => {
                if (!current[part]) current[part] = {};
                current = current[part];
            });
        });
        function renderTree(obj, indent = 0) {
            let html = '';
            const keys = Object.keys(obj).sort();
            keys.forEach(key => {
                html += '  '.repeat(indent) + '📁 ' + escapeHtml(key) + '\n';
                if (Object.keys(obj[key]).length) {
                    html += renderTree(obj[key], indent + 1);
                }
            });
            return html;
        }
        return renderTree(tree);
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        let startUrl = startUrlInput.value.trim();
        if (!startUrl) { showToast('Enter a start URL', true); return; }
        if (!startUrl.startsWith('http')) startUrl = 'https://' + startUrl;
        const maxPages = parseInt(maxPagesInput.value) || 200;
        const maxDepth = parseInt(maxDepthInput.value) || 3;

        try {
            const resp = await fetch('/crawler/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `start_url=${encodeURIComponent(startUrl)}&max_pages=${maxPages}&max_depth=${maxDepth}`
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            currentTaskId = data.task_id;
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Crawling started...';
            urlListDiv.innerHTML = '<div class="empty-state">Crawling...</div>';
            dirListDiv.innerHTML = '<div class="empty-state">Crawling...</div>';
            pagesVisitedSpan.textContent = '0';
            urlCountSpan.textContent = '0';
            currentUrlSpan.textContent = '-';
            targetDomainSpan.textContent = '-';
            downloadUrlsBtn.style.display = 'none';
            downloadDirsBtn.style.display = 'none';
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollCrawler, 1500);
        } catch (err) {
            showToast(err.message, true);
        }
    });

    async function pollCrawler() {
        if (!currentTaskId) return;
        try {
            const resp = await fetch(`/crawler/status/${currentTaskId}`);
            const data = await resp.json();
            if (data.error) {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">Error: ${data.error}</span>`;
                return;
            }
            const status = data.status;
            const progress = data.progress || 0;
            const totalPages = data.total_pages || 0;
            const urls = data.internal_urls || [];
            const currentUrl = data.current_url || '-';
            const domain = data.target_domain || '-';

            targetDomainSpan.textContent = domain;
            currentUrlSpan.textContent = currentUrl;
            pagesVisitedSpan.textContent = totalPages;
            urlCountSpan.textContent = urls.length;

            // Update URL list (show first 200)
            if (urls.length > 0) {
                let html = '';
                urls.slice(0, 200).forEach(u => {
                    html += `<div style="font-size:0.8rem; padding:2px 0; border-bottom:1px solid #2a3248; word-break:break-all;">${escapeHtml(u)}</div>`;
                });
                if (urls.length > 200) html += `<div style="color:#aaa; font-size:0.8rem;">... and ${urls.length - 200} more</div>`;
                urlListDiv.innerHTML = html;
            } else {
                urlListDiv.innerHTML = '<div class="empty-state">No URLs yet.</div>';
            }

            // Update directory structure
            if (urls.length > 0) {
                const dirTree = renderDirectoryTree(urls);
                dirListDiv.innerHTML = `<pre style="margin:0; color:#eef2ff; font-family:monospace; font-size:0.8rem;">${escapeHtml(dirTree)}</pre>`;
            } else {
                dirListDiv.innerHTML = '<div class="empty-state">No directories yet.</div>';
            }

            if (status === 'done') {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `✅ Crawling completed. Found ${urls.length} internal URLs.`;
                downloadUrlsBtn.style.display = 'inline-flex';
                downloadDirsBtn.style.display = 'inline-flex';
                downloadUrlsBtn.onclick = () => {
                    window.open(`/crawler/download_urls/${currentTaskId}`, '_blank');
                };
                downloadDirsBtn.onclick = () => {
                    window.open(`/crawler/download_directories/${currentTaskId}`, '_blank');
                };
            } else if (status === 'error') {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">❌ Error: ${data.error_msg}</span>`;
            } else {
                statusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Crawling... (${progress}%, ${totalPages} pages visited)`;
            }
        } catch (err) {
            console.error(err);
        }
    }

    // Show saved files
    showFilesBtn.addEventListener('click', async function() {
        try {
            const resp = await fetch('/crawler/list_files');
            const files = await resp.json();
            if (files.length === 0) {
                savedFilesList.innerHTML = '<div class="empty-state">No saved files found.</div>';
            } else {
                let html = '';
                files.forEach(f => {
                    const sizeStr = f.size > 1024 ? (f.size/1024).toFixed(1) + ' KB' : f.size + ' B';
                    html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid #2a3248;">
                                <span>${escapeHtml(f.name)} (${sizeStr})</span>
                                <a href="/download/${encodeURIComponent(f.path)}" class="primary" style="padding:0.2rem 0.6rem; font-size:0.7rem;"><i class="fas fa-download"></i> Download</a>
                            </div>`;
                });
                savedFilesList.innerHTML = html;
            }
            savedFilesSection.style.display = 'block';
        } catch (err) {
            showToast('Failed to load saved files', true);
        }
    });
})();
</script>
