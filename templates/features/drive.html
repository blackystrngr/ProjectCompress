<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <h2><i class="fab fa-google-drive"></i> Google Drive Files</h2>
        <button id="refreshDriveBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    <div id="driveActionBar" class="action-bar" style="display: none;">
        <span class="selected-info"><span id="driveSelectedCount">0</span> selected</span>
        <div class="action-buttons">
            <button id="downloadSelectedDriveBtn" class="primary"><i class="fas fa-download"></i> Download Selected</button>
            <button id="deselectAllDriveBtn">Deselect All</button>
        </div>
    </div>
    <div id="driveFileList" class="file-grid empty-state">Loading Drive files...</div>
</div>

<script>
let driveFiles = [], selectedDriveIds = new Set();
async function loadDriveFiles() {
    document.getElementById('driveFileList').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>';
    try {
        const resp = await fetch('/drive/list');
        const files = await resp.json();
        if (files.error) throw new Error(files.error);
        driveFiles = files;
        if (!driveFiles.length) {
            document.getElementById('driveFileList').innerHTML = '<div class="empty-state">No files found in Drive folder.</div>';
            document.getElementById('driveActionBar').style.display = 'none';
            return;
        }
        renderDriveFileList();
    } catch (err) {
        document.getElementById('driveFileList').innerHTML = `<div class="empty-state" style="color:#ff8a8a;">Error: ${err.message}</div>`;
    }
}

function renderDriveFileList() {
    let html = '';
    driveFiles.forEach(file => {
        const isSelected = selectedDriveIds.has(file.id);
        html += `<div class="file-card ${isSelected ? 'selected' : ''}" data-id="${file.id}">
                    <input type="checkbox" class="file-checkbox drive-checkbox" data-id="${file.id}" ${isSelected ? 'checked' : ''}>
                    <div class="file-name"><i class="fas fa-file"></i> ${escapeHtml(file.name)}</div>
                    <div class="file-size">${file.size_str}</div>
                    <div class="file-actions">
                        <button class="drive-download-single" data-id="${file.id}" data-name="${escapeHtml(file.name)}"><i class="fas fa-download"></i> Download</button>
                        <button class="drive-delete" data-id="${file.id}"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                </div>`;
    });
    document.getElementById('driveFileList').innerHTML = html;
    attachDriveEvents();
    updateDriveSelectionUI();
}

function attachDriveEvents() {
    document.querySelectorAll('.drive-checkbox').forEach(cb => {
        cb.onchange = () => {
            const id = cb.dataset.id;
            if (cb.checked) selectedDriveIds.add(id);
            else selectedDriveIds.delete(id);
            updateDriveSelectionUI();
        };
    });
    document.querySelectorAll('.drive-download-single').forEach(btn => {
        btn.onclick = async () => {
            const id = btn.dataset.id, name = btn.dataset.name;
            const resp = await fetch('/drive/download_to_server', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `file_id=${id}&file_name=${encodeURIComponent(name)}`
            });
            const data = await resp.json();
            if (data.error) showToast(data.error, true);
            else showToast(`Task started: ${data.task_id}`);
            fetchTasks();
        };
    });
    document.querySelectorAll('.drive-delete').forEach(btn => {
        btn.onclick = async () => {
            if (!confirm('Permanently delete from Drive?')) return;
            const id = btn.dataset.id;
            const resp = await fetch(`/drive/delete/${id}`, { method: 'DELETE' });
            if (resp.ok) { showToast('Deleted'); loadDriveFiles(); }
            else showToast('Delete failed', true);
        };
    });
}

function updateDriveSelectionUI() {
    const count = selectedDriveIds.size;
    const actionBar = document.getElementById('driveActionBar');
    if (count > 0) {
        actionBar.style.display = 'flex';
        document.getElementById('driveSelectedCount').textContent = count;
    } else {
        actionBar.style.display = 'none';
    }
    document.querySelectorAll('#driveFileList .file-card').forEach(card => {
        const id = card.dataset.id;
        if (selectedDriveIds.has(id)) card.classList.add('selected');
        else card.classList.remove('selected');
    });
}

document.getElementById('refreshDriveBtn').onclick = loadDriveFiles;
document.getElementById('downloadSelectedDriveBtn').onclick = async () => {
    if (selectedDriveIds.size === 0) return;
    for (let id of selectedDriveIds) {
        const file = driveFiles.find(f => f.id === id);
        if (file) {
            await fetch('/drive/download_to_server', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `file_id=${id}&file_name=${encodeURIComponent(file.name)}`
            });
        }
    }
    showToast(`Started download of ${selectedDriveIds.size} file(s)`);
    fetchTasks();
};
document.getElementById('deselectAllDriveBtn').onclick = () => {
    selectedDriveIds.clear();
    updateDriveSelectionUI();
    renderDriveFileList();
};
loadDriveFiles();
</script>
