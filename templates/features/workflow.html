<script>
(function () {
'use strict';

// ============================================================
// Constants
// ============================================================
const NODE_W = 240;
const NODE_H = 90;
const PORT_Y = NODE_H / 2;
const MIN_ZOOM = 0.3;
const MAX_ZOOM = 2.5;
const DRAG_THRESHOLD = 3;

// ============================================================
// State
// ============================================================
let NODE_TYPES = {};
let nodes = [];
let edges = [];                        // [{from, to}]
let selectedNodeId = null;
let currentWorkflowId = null;
let isDirty = false;
let runningTaskId = null;
let pollInterval = null;
let nodeStatuses = {};
let nodeOrder = {};                    // node_id -> 1-based order in chain

let panX = 0, panY = 0, zoom = 1;

let mode = 'idle';                     // idle | node-down | dragging-node | dragging-wire | panning
let dragStart = null;
let dragOffset = { x: 0, y: 0 };
let wireSource = null;                 // { nodeId, x, y } (world coords)
let wireTempEl = null;

// ============================================================
// DOM
// ============================================================
const $ = (id) => document.getElementById(id);
const viewport = $('wfViewport');
const world = $('wfWorld');
const svg = $('wfSvg');
const wiresEl = $('wfWires');
const nodesEl = $('wfNodes');
const paletteEl = $('wfPalette');
const inspectorEl = $('wfInspector');
const wfSelect = $('wfSelect');
const wfName = $('wfName');
const wfStatus = $('wfStatus');
const wfHint = $('wfHint');
const wfLog = $('wfLog');
const runBtn = $('wfRunBtn');
const stopBtn = $('wfStopBtn');
const saveBtn = $('wfSaveBtn');

// ============================================================
// Utility
// ============================================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, function (m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
}
function showToast(msg, isErr) {
    if (typeof window.showToast === 'function') window.showToast(msg, isErr);
    else alert((isErr ? 'Error: ' : '') + msg);
}
function newId() { return 'n_' + Math.random().toString(36).substring(2, 10); }

function worldCenterOfViewport() {
    const r = viewport.getBoundingClientRect();
    return {
        x: (r.width / 2 - panX) / zoom - NODE_W / 2,
        y: (r.height / 2 - panY) / zoom - NODE_H / 2,
    };
}

function applyTransform() {
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

function screenToWorld(clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    return {
        x: (clientX - rect.left - panX) / zoom,
        y: (clientY - rect.top - panY) / zoom,
    };
}

function zoomAt(factor, clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    const wx = (mx - panX) / zoom;
    const wy = (my - panY) / zoom;
    const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
    panX = mx - wx * newZoom;
    panY = my - wy * newZoom;
    zoom = newZoom;
    applyTransform();
}

// ============================================================
// Graph helpers
// ============================================================
function outEdge(nodeId) { return edges.find(e => e.from === nodeId); }
function inEdge(nodeId) { return edges.find(e => e.to === nodeId); }
function nodeById(id) { return nodes.find(n => n.id === id); }

function recomputeOrder() {
    // Topological order from trigger
    nodeOrder = {};
    const trigger = nodes.find(n => n.type.startsWith('trigger.'));
    if (!trigger) return;
    let cur = trigger;
    let order = 1;
    const seen = new Set();
    while (cur && !seen.has(cur.id)) {
        nodeOrder[cur.id] = order++;
        seen.add(cur.id);
        const edge = outEdge(cur.id);
        cur = edge ? nodeById(edge.to) : null;
    }
}

// ============================================================
// Node summary
// ============================================================
function nodeSummary(type, config) {
    config = config || {};
    if (type === 'trigger.url_list') {
        const urls = String(config.urls || '').split('\n')
            .filter(l => l.trim() && !l.trim().startsWith('#'));
        return `${urls.length} URL${urls.length === 1 ? '' : 's'} · ${config.quality || '1080p'}`;
    }
    if (type === 'action.download') return 'yt-dlp';
    if (type === 'action.download_file') return 'direct file';
    if (type === 'action.telegram_send') return config.chat_link || 'no chat';
    if (type === 'action.drive_upload') return 'account: ' + (config.account || 'default');
    if (type === 'action.compress') return `${config.codec || 'x265'} · ${config.resolution || 720}p · crf ${config.crf || 27}`;
    if (type === 'action.delete_local') return 'delete file';
    if (type === 'action.delete_drive') return 'delete from Drive';
    if (type === 'action.wait') return `${config.seconds || 5}s`;
    if (type === 'action.webhook') return config.url ? config.url.slice(0, 40) : 'no url';
    return '';
}

// ============================================================
// Rendering
// ============================================================
function renderPalette() {
    const cats = {};
    Object.entries(NODE_TYPES).forEach(([type, meta]) => {
        const cat = meta.category || 'other';
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push([type, meta]);
    });
    const labels = { trigger: 'Trigger', action: 'Actions' };
    let html = '';
    Object.entries(cats).forEach(([cat, list]) => {
        html += `<div class="wf-palette-cat">${labels[cat] || cat}</div>`;
        list.forEach(([type, meta]) => {
            html += `<div class="wf-palette-item"
                        style="border-left-color:${meta.color};"
                        data-type="${type}"
                        title="${escapeHtml(meta.description)}">
                <i class="fas ${meta.icon}" style="color:${meta.color};"></i>
                <span class="wf-palette-item-text">${escapeHtml(meta.label)}</span>
            </div>`;
        });
    });
    paletteEl.innerHTML = html;
    paletteEl.querySelectorAll('.wf-palette-item').forEach(el => {
        el.addEventListener('click', () => addNodeFromPalette(el.dataset.type));
    });
}

function renderNodes() {
    if (!nodes.length) {
        nodesEl.innerHTML = '';
        wfHint.textContent = 'Add a trigger node from the palette to begin';
        wfHint.style.display = 'block';
        return;
    }
    wfHint.style.display = 'none';

    let html = '';
    nodes.forEach(node => {
        const meta = NODE_TYPES[node.type] || {};
        const status = (nodeStatuses[node.id] && nodeStatuses[node.id].status) || 'idle';
        const progress = (nodeStatuses[node.id] && nodeStatuses[node.id].progress) || 0;
        const orderNum = nodeOrder[node.id] || '';
        const isTrigger = node.type.startsWith('trigger.');

        html += `<div class="wf-node ${status} ${selectedNodeId === node.id ? 'selected' : ''}"
                      data-node-id="${node.id}"
                      style="left:${node.x}px; top:${node.y}px; border-left-color:${meta.color || '#5f8fe0'};">
            ${!isTrigger ? `<div class="wf-port wf-port-in" data-node-id="${node.id}"></div>` : ''}
            <div class="wf-node-header">
                <i class="fas ${meta.icon || 'fa-cog'}" style="color:${meta.color || '#5f8fe0'};"></i>
                <span>${escapeHtml(meta.label || node.type)}</span>
                ${orderNum ? `<span class="wf-node-order">#${orderNum}</span>` : ''}
            </div>
            <div class="wf-node-body">${escapeHtml(nodeSummary(node.type, node.config))}</div>
            <div class="wf-port wf-port-out" data-node-id="${node.id}"></div>
            ${status === 'running' ? `<div class="wf-node-progress"><div class="wf-node-progress-bar" style="width:${progress}%; background:linear-gradient(90deg,${meta.color || '#5f8fe0'},#a5c0ff);"></div></div>` : ''}
        </div>`;
    });
    nodesEl.innerHTML = html;
    attachNodeEvents();
}

function renderWires() {
    let html = '';
    edges.forEach((edge, idx) => {
        const from = nodeById(edge.from);
        const to = nodeById(edge.to);
        if (!from || !to) return;
        const x1 = from.x + NODE_W;
        const y1 = from.y + PORT_Y;
        const x2 = to.x;
        const y2 = to.y + PORT_Y;
        const d = wirePath(x1, y1, x2, y2);
        const meta = NODE_TYPES[from.type] || {};
        const color = meta.color || '#5f8fe0';
        html += `<g class="wf-wire-group" data-edge-idx="${idx}">
            <path class="wf-wire-hit" d="${d}"></path>
            <path class="wf-wire-visible" d="${d}" stroke="${color}"></path>
        </g>`;
    });
    wiresEl.innerHTML = html;
    wiresEl.querySelectorAll('.wf-wire-hit').forEach(hit => {
        hit.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(hit.parentElement.dataset.edgeIdx);
            if (confirm('Delete this connection?')) {
                edges.splice(idx, 1);
                recomputeOrder();
                markDirty();
                renderNodes();
                renderWires();
            }
        });
    });
}

function renderInspector() {
    if (!selectedNodeId) {
        inspectorEl.innerHTML = `<div style="font-size: 0.8rem; color: #6b7a9c; text-align: center; padding: 1.5rem 0.5rem;">
            Click a node to configure
        </div>`;
        return;
    }
    const node = nodeById(selectedNodeId);
    if (!node) { inspectorEl.innerHTML = ''; return; }
    const meta = NODE_TYPES[node.type] || {};

    let html = `<div class="wf-inspector-title" style="color:${meta.color || '#5f8fe0'};">
        <i class="fas ${meta.icon || 'fa-cog'}"></i>
        ${escapeHtml(meta.label || node.type)}
    </div>`;
    html += `<div class="wf-inspector-desc">${escapeHtml(meta.description || '')}</div>`;

    (meta.fields || []).forEach(field => {
        const val = (node.config && node.config[field.name] !== undefined)
            ? node.config[field.name]
            : (field.default !== undefined ? field.default : '');

        if (field.type === 'select') {
            html += `<label class="wf-field">
                <span class="wf-field-label">${escapeHtml(field.label)}</span>
                <select data-field="${field.name}">`;
            (field.options || []).forEach(opt => {
                html += `<option value="${escapeHtml(opt)}" ${String(opt) === String(val) ? 'selected' : ''}>${escapeHtml(opt)}</option>`;
            });
            html += `</select>`;
            if (field.help) html += `<div class="wf-field-help">${escapeHtml(field.help)}</div>`;
            html += `</label>`;
        } else if (field.type === 'textarea') {
            html += `<label class="wf-field">
                <span class="wf-field-label">${escapeHtml(field.label)}</span>
                <textarea data-field="${field.name}" rows="5"
                    placeholder="${escapeHtml(field.placeholder || '')}">${escapeHtml(String(val || ''))}</textarea>`;
            if (field.help) html += `<div class="wf-field-help">${escapeHtml(field.help)}</div>`;
            html += `</label>`;
        } else {
            html += `<label class="wf-field">
                <span class="wf-field-label">${escapeHtml(field.label)}</span>
                <input type="${field.type || 'text'}" data-field="${field.name}"
                       value="${escapeHtml(String(val || ''))}"
                       placeholder="${escapeHtml(field.placeholder || '')}">`;
            if (field.help) html += `<div class="wf-field-help">${escapeHtml(field.help)}</div>`;
            html += `</label>`;
        }
    });

    html += `<button class="wf-delete-node-btn" id="wfDeleteSelectedNode">
        <i class="fas fa-trash-alt"></i> Delete node
    </button>`;

    inspectorEl.innerHTML = html;

    inspectorEl.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', () => {
            if (!node.config) node.config = {};
            if (el.type === 'number') {
                const n = parseFloat(el.value);
                node.config[el.dataset.field] = isNaN(n) ? el.value : n;
            } else {
                node.config[el.dataset.field] = el.value;
            }
            markDirty();
            renderNodes();
        });
    });
    const delBtn = inspectorEl.querySelector('#wfDeleteSelectedNode');
    if (delBtn) delBtn.addEventListener('click', () => deleteNode(selectedNodeId));
}

function renderAll() {
    recomputeOrder();
    renderNodes();
    renderWires();
    renderInspector();
}

// ============================================================
// Wire path
// ============================================================
function wirePath(x1, y1, x2, y2) {
    const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

// ============================================================
// Node events (drag + select)
// ============================================================
function attachNodeEvents() {
    nodesEl.querySelectorAll('.wf-node').forEach(el => {
        const nodeId = el.dataset.nodeId;
        const node = nodeById(nodeId);
        if (!node) return;

        el.addEventListener('mousedown', (e) => {
            // Ignore clicks on ports
            if (e.target.closest('.wf-port')) return;
            if (e.button !== 0) return;

            e.stopPropagation();
            mode = 'node-down';
            dragStart = { x: e.clientX, y: e.clientY, nodeStartX: node.x, nodeStartY: node.y };
            dragOffset = { x: 0, y: 0 };
            dragStart.nodeId = nodeId;
        });

        el.addEventListener('click', (e) => {
            if (e.target.closest('.wf-port')) return;
            if (mode !== 'idle' && mode !== 'node-down') return;
            // Select if not dragging
            if (dragOffset.x === 0 && dragOffset.y === 0) {
                selectedNodeId = nodeId;
                renderAll();
            }
        });
    });

    // Ports
    nodesEl.querySelectorAll('.wf-port-out').forEach(port => {
        port.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            if (e.button !== 0) return;
            const nodeId = port.dataset.nodeId;
            const node = nodeById(nodeId);
            if (!node) return;
            wireSource = {
                nodeId,
                x: node.x + NODE_W,
                y: node.y + PORT_Y,
            };
            mode = 'dragging-wire';
            viewport.classList.add('wire-mode');

            // Highlight drop targets
            nodesEl.querySelectorAll('.wf-port-in').forEach(p => p.classList.add('drop-target'));

            // Create temp wire
            wireTempEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            wireTempEl.setAttribute('class', 'wf-wire-temp');
            wiresEl.appendChild(wireTempEl);
        });
    });
}

// ============================================================
// Viewport events (pan, zoom)
// ============================================================
viewport.addEventListener('mousedown', (e) => {
    if (e.button === 1 || (e.button === 0 && e.target === viewport)) {
        // Middle-click or background click → pan
        mode = 'panning';
        dragStart = { x: e.clientX, y: e.clientY, panX, panY };
        viewport.classList.add('panning');
        e.preventDefault();
    } else if (e.target === viewport || e.target === world || e.target === svg) {
        // Background click → deselect
        selectedNodeId = null;
        renderAll();
    }
});

viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

// ============================================================
// Global mousemove / mouseup
// ============================================================
document.addEventListener('mousemove', (e) => {
    if (mode === 'node-down') {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
            mode = 'dragging-node';
            const n = nodeById(dragStart.nodeId);
            if (n) n._dragging = true;
        }
    }

    if (mode === 'dragging-node') {
        const node = nodeById(dragStart.nodeId);
        if (node) {
            const dx = (e.clientX - dragStart.x) / zoom;
            const dy = (e.clientY - dragStart.y) / zoom;
            node.x = dragStart.nodeStartX + dx;
            node.y = dragStart.nodeStartY + dy;
            // Update node position without full re-render (perf)
            const el = nodesEl.querySelector(`[data-node-id="${node.id}"]`);
            if (el) {
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
            }
            renderWires();
            dragOffset = { x: dx, y: dy };
        }
    }

    if (mode === 'dragging-wire' && wireSource && wireTempEl) {
        const w = screenToWorld(e.clientX, e.clientY);
        const d = wirePath(wireSource.x, wireSource.y, w.x, w.y);
        wireTempEl.setAttribute('d', d);

        // Highlight nearest port
        nodesEl.querySelectorAll('.wf-port-in.drop-target').forEach(p => {
            p.classList.remove('drop-target');
        });
        const hit = portUnderCursor(e.clientX, e.clientY);
        if (hit && hit.dataset.nodeId !== wireSource.nodeId) {
            hit.classList.add('drop-target');
        }
    }

    if (mode === 'panning') {
        panX = dragStart.panX + (e.clientX - dragStart.x);
        panY = dragStart.panY + (e.clientY - dragStart.y);
        applyTransform();
    }
});

document.addEventListener('mouseup', (e) => {
    if (mode === 'node-down') {
        // It was a click, not a drag
        selectedNodeId = dragStart.nodeId;
        renderAll();
    } else if (mode === 'dragging-node') {
        if (dragOffset.x !== 0 || dragOffset.y !== 0) markDirty();
        dragOffset = { x: 0, y: 0 };
    } else if (mode === 'dragging-wire') {
        const hit = portUnderCursor(e.clientX, e.clientY);
        if (hit) {
            const toId = hit.dataset.nodeId;
            if (toId !== wireSource.nodeId) {
                createOrReplaceEdge(wireSource.nodeId, toId);
            }
        }
        // Cleanup
        if (wireTempEl && wireTempEl.parentNode) wireTempEl.remove();
        wireTempEl = null;
        wireSource = null;
        nodesEl.querySelectorAll('.wf-port-in').forEach(p => p.classList.remove('drop-target'));
        viewport.classList.remove('wire-mode');
        renderAll();
    } else if (mode === 'panning') {
        viewport.classList.remove('panning');
    }
    mode = 'idle';
});

function portUnderCursor(clientX, clientY) {
    const ports = nodesEl.querySelectorAll('.wf-port-in');
    for (const port of ports) {
        const r = port.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dist = Math.hypot(clientX - cx, clientY - cy);
        if (dist < 28) return port;
    }
    return null;
}

function createOrReplaceEdge(fromId, toId) {
    // Remove existing edge from `from` (only 1 out per node)
    edges = edges.filter(e => e.from !== fromId);
    // Remove existing edge to `to` (only 1 in per node)
    edges = edges.filter(e => e.to !== toId);
    edges.push({ from: fromId, to: toId });
    markDirty();
    recomputeOrder();
}

// ============================================================
// Node CRUD
// ============================================================
function addNodeFromPalette(type) {
    if (!NODE_TYPES[type]) return;
    if (type.startsWith('trigger.') && nodes.some(n => n.type.startsWith('trigger.'))) {
        showToast('Only one trigger allowed per workflow', true);
        return;
    }
    if (!type.startsWith('trigger.') && !nodes.some(n => n.type.startsWith('trigger.'))) {
        showToast('Add a trigger first', true);
        return;
    }
    const meta = NODE_TYPES[type];
    const config = {};
    (meta.fields || []).forEach(f => {
        if (f.default !== undefined) config[f.name] = f.default;
    });
    const center = worldCenterOfViewport();
    const jitter = nodes.length * 25;
    const node = {
        id: newId(),
        type,
        config,
        x: center.x + jitter - 60,
        y: center.y + jitter - 30,
    };
    nodes.push(node);
    selectedNodeId = node.id;

    // Auto-connect if only one existing node and it's a trigger
    // (great UX for building a chain quickly)
    if (nodes.length >= 2 && !type.startsWith('trigger.')) {
        const trigger = nodes.find(n => n.type.startsWith('trigger.'));
        if (trigger && !outEdge(trigger.id) && nodes.length === 2) {
            edges.push({ from: trigger.id, to: node.id });
        }
    }

    markDirty();
    renderAll();
}

function deleteNode(nodeId) {
    if (!nodeId) return;
    if (!confirm('Delete this node and its connections?')) return;
    nodes = nodes.filter(n => n.id !== nodeId);
    edges = edges.filter(e => e.from !== nodeId && e.to !== nodeId);
    if (selectedNodeId === nodeId) selectedNodeId = null;
    markDirty();
    renderAll();
}

// ============================================================
// Keyboard
// ============================================================
document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!selectedNodeId) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteNode(selectedNodeId);
    }
});

// ============================================================
// Dirty state
// ============================================================
function markDirty() {
    isDirty = true;
    updateToolbarState();
}
function updateToolbarState() {
    const nameStr = wfName.value || '(unnamed)';
    let s = '';
    if (runningTaskId) s = '● Running';
    else if (isDirty) s = '● Unsaved changes';
    else if (currentWorkflowId) s = '● Saved';
    wfStatus.textContent = nameStr + (s ? '  ·  ' + s : '');
    wfStatus.style.color = runningTaskId ? '#5f8fe0' : isDirty ? '#f59e0b' : '#8a9bc0';
}

// ============================================================
// Save / Load / List
// ============================================================
async function loadWorkflowList() {
    try {
        const r = await fetch('/workflow/list', { cache: 'no-store' });
        const list = await r.json();
        let html = '<option value="">— Load workflow —</option>';
        list.forEach(wf => {
            html += `<option value="${escapeHtml(wf.id)}">${escapeHtml(wf.name)} (${wf.node_count} nodes)</option>`;
        });
        wfSelect.innerHTML = html;
        if (currentWorkflowId) wfSelect.value = currentWorkflowId;
    } catch (e) { console.error(e); }
}

async function loadWorkflow(id) {
    if (!id) return;
    try {
        const r = await fetch(`/workflow/get/${id}`, { cache: 'no-store' });
        if (!r.ok) { showToast('Failed to load workflow', true); return; }
        const wf = await r.json();
        currentWorkflowId = wf.id;
        wfName.value = wf.name || '';
        nodes = wf.nodes || [];
        edges = wf.edges || [];
        selectedNodeId = null;
        nodeStatuses = {};
        isDirty = false;
        try { localStorage.setItem('wf_last_id', wf.id); } catch (e) {}
        // Reset view
        panX = 0; panY = 0; zoom = 1;
        applyTransform();
        renderAll();
        updateToolbarState();
    } catch (e) {
        showToast('Failed to load: ' + e.message, true);
    }
}

async function saveWorkflow() {
    if (!nodes.length) { showToast('Add nodes before saving', true); return; }
    // Strip runtime props
    const cleanNodes = nodes.map(n => ({
        id: n.id, type: n.type, config: n.config || {},
        x: Math.round(n.x), y: Math.round(n.y),
    }));
    const payload = {
        id: currentWorkflowId || undefined,
        name: wfName.value || 'Untitled Workflow',
        nodes: cleanNodes,
        edges: edges.map(e => ({ from: e.from, to: e.to })),
