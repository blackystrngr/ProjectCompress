<script>
(function () {
'use strict';

// ── Constants ──
const NODE_W = 240;
const MIN_ZOOM = 0.3, MAX_ZOOM = 2.5;
const DRAG_THRESHOLD = 3;
const AUTOSAVE_DELAY_MS = 3500;

// ── State ──
let NODE_TYPES = {};
let nodes = [], edges = [];
let selectedNodeId = null;
let currentWorkflowId = null;
let isDirty = false;
let isSaving = false;
let autosaveTimer = null;
let streamSource = null;
let pollInterval = null;
let runningTaskId = null;
let nodeStatuses = {};
let failedTaskId = null;

// nodeId -> Set of edge indices (for incremental wire updates)
let nodeEdgeIndices = new Map();

let panX = 0, panY = 0, zoom = 1;

let mode = 'idle';
let dragStart = null;
let dragOffset = { x: 0, y: 0 };
let draggedNodeEl = null;
let wireSource = null;
let wireTempEl = null;

// ── DOM refs ──
const $ = (id) => document.getElementById(id);
const viewport = $('wfViewport');
const world = $('wfWorld');
const svg = $('wfSvg');
const wiresEl = $('wfWires');
const nodesEl = $('wfNodes');
const paletteEl = $('wfPalette');
const inspectorEl = $('wfInspector');
const wfSelect = $('wfSelect');
const wfName = $('wfName');
const wfStatus = $('wfStatus');
const wfHint = $('wfHint');
const wfLog = $('wfLog');
const runBtn = $('wfRunBtn');
const dryRunBtn = $('wfDryRunBtn');
const stopBtn = $('wfStopBtn');
const resumeBtn = $('wfResumeBtn');
const saveBtn = $('wfSaveBtn');
const exportBtn = $('wfExportBtn');
const importBtn = $('wfImportBtn');
const importInput = $('wfImportInput');

// ── Utils ──
function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
function showToast(msg, isErr) {
    if (typeof window.showToast === 'function') window.showToast(msg, isErr);
    else alert((isErr ? 'Error: ' : '') + msg);
}
function newId() { return 'n_' + Math.random().toString(36).substring(2, 10); }
function nodeById(id) { return nodes.find(n => n.id === id); }

function applyTransform() {
    world.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoom})`;
}

function screenToWorld(clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    return {
        x: (clientX - rect.left - panX) / zoom,
        y: (clientY - rect.top - panY) / zoom,
    };
}
function worldCenterOfViewport() {
    const r = viewport.getBoundingClientRect();
    return {
        x: (r.width / 2 - panX) / zoom - NODE_W / 2,
        y: (r.height / 2 - panY) / zoom - 90,
    };
}
function zoomAt(factor, clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    const wx = (mx - panX) / zoom;
    const wy = (my - panY) / zoom;
    const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
    panX = mx - wx * newZoom;
    panY = my - wy * newZoom;
    zoom = newZoom;
    applyTransform();
}

// ── Port helpers ──
function nodePorts(node) {
    const meta = NODE_TYPES[node.type];
    if (!meta || !meta.ports) return { in: ['in'], out: ['out'] };
    return { in: meta.ports.in || [], out: meta.ports.out || [] };
}
function portTopPct(portList, portName) {
    const idx = portList.indexOf(portName);
    if (idx < 0) return 50;
    if (portList.length === 1) return 50;
    return (idx + 1) * 100 / (portList.length + 1);
}
function portWorldPos(node, portName, direction) {
    const ports = direction === 'in' ? nodePorts(node).in : nodePorts(node).out;
    const idx = ports.indexOf(portName);
    if (idx < 0) return null;
    const topPct = portTopPct(ports, portName);
    const nodeH = 90;
    return {
        x: direction === 'in' ? node.x : node.x + NODE_W,
        y: node.y + (nodeH * topPct / 100),
    };
}

// ── rAF-scheduled renders ──
let _renderNodesScheduled = false;
function scheduleRenderNodes() {
    if (_renderNodesScheduled) return;
    _renderNodesScheduled = true;
    requestAnimationFrame(() => {
        _renderNodesScheduled = false;
        renderNodes();
    });
}

let _renderWiresScheduled = false;
function scheduleRenderWires() {
    if (_renderWiresScheduled) return;
    _renderWiresScheduled = true;
    requestAnimationFrame(() => {
        _renderWiresScheduled = false;
        renderWires();
    });
}

// ── Wire geometry (incremental) ──
function wirePath(x1, y1, x2, y2) {
    const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function rebuildEdgeAdjacency() {
    nodeEdgeIndices = new Map();
    edges.forEach((e, idx) => {
        if (!nodeEdgeIndices.has(e.from)) nodeEdgeIndices.set(e.from, new Set());
        if (!nodeEdgeIndices.has(e.to)) nodeEdgeIndices.set(e.to, new Set());
        nodeEdgeIndices.get(e.from).add(idx);
        nodeEdgeIndices.get(e.to).add(idx);
    });
}

function updateWireGeometry(edgeIdx) {
    const edge = edges[edgeIdx];
    if (!edge) return;
    const from = nodeById(edge.from);
    const to = nodeById(edge.to);
    if (!from || !to) return;
    const fromPort = edge.from_port || 'out';
    const p1 = portWorldPos(from, fromPort, 'out');
    const p2 = portWorldPos(to, 'in', 'in');
    if (!p1 || !p2) return;

    const g = wiresEl.querySelector(`[data-edge-idx="${edgeIdx}"]`);
    if (!g) return;
    const d = wirePath(p1.x, p1.y, p2.x, p2.y);
    const paths = g.querySelectorAll('path');
    for (const p of paths) p.setAttribute('d', d);
}

function updateConnectedWires(nodeId) {
    const set = nodeEdgeIndices.get(nodeId);
    if (!set) return;
    for (const idx of set) updateWireGeometry(idx);
}

// ── Palette ──
function renderPalette() {
    const cats = {};
    Object.entries(NODE_TYPES).forEach(([type, meta]) => {
        const cat = meta.category || 'other';
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push([type, meta]);
    });
    const labels = { trigger: 'Trigger', action: 'Actions', logic: 'Logic', data: 'Data' };
    let html = '';
    Object.entries(cats).forEach(([cat, list]) => {
        html += `<div class="wf-palette-cat">${labels[cat] || cat}</div>`;
        list.forEach(([type, meta]) => {
            html += `<div class="wf-palette-item" style="border-left-color:${meta.color};"
                        data-type="${type}" title="${escapeHtml(meta.description)}">
                <i class="fas ${meta.icon}" style="color:${meta.color};"></i>
                <span class="wf-palette-item-text">${escapeHtml(meta.label)}</span>
            </div>`;
        });
    });
    paletteEl.innerHTML = html;
    paletteEl.querySelectorAll('.wf-palette-item').forEach(el => {
        el.addEventListener('click', () => addNodeFromPalette(el.dataset.type));
    });
}

// ── Node summary ──
function nodeSummary(type, config) {
    config = config || {};
    if (type === 'trigger.url_list') {
        const urls = String(config.urls || '').split('\n')
            .filter(l => l.trim() && !l.trim().startsWith('#'));
        return `${urls.length} URL${urls.length === 1 ? '' : 's'} · ${config.quality || '1080p'}`;
    }
    if (type === 'trigger.file_glob') return config.pattern || '*.mp4';
    if (type === 'action.download') return 'yt-dlp';
    if (type === 'action.download_file') return 'direct file';
    if (type === 'action.telegram_send') return config.chat_link || 'no chat';
    if (type === 'action.drive_upload') return 'account: ' + (config.account || 'default');
    if (type === 'action.compress') return `${config.codec || 'x265'} · ${config.resolution || 720}p`;
    if (type === 'action.delete_local') return 'delete file';
    if (type === 'action.delete_drive') return 'delete from Drive';
    if (type === 'action.wait') return `${config.seconds || 5}s`;
    if (type === 'action.webhook') return config.url ? config.url.slice(0, 40) : 'no url';
    if (type === 'action.extract_metadata') return 'ffprobe';
    if (type === 'action.sub_workflow') return '→ ' + (config.workflow_id || '?');
    if (type === 'action.user_input') return (config.message || 'Approve?').slice(0, 30);
    if (type === 'action.json_parse') return `${config.source || '?'} → vars.${config.into_var || '?'}`;
    if (type === 'action.string_ops') return `${config.operation || 'lower'} → ${config.target || '?'}`;
    if (type === 'action.assert') return (config.expression || '?').slice(0, 30);
    if (type === 'action.http_fetch') return (config.url || '?').slice(0, 35);
    if (type === 'action.log') return `[${config.level || 'info'}] ${(config.message || '').slice(0, 25)}`;
    if (type === 'logic.condition') return (config.expression || '').slice(0, 30);
    if (type === 'logic.switch') return `${config.expression || '?'} → ${(config.cases || '').split(',').length} case(s)`;
    if (type === 'logic.merge') return config.mode || 'all';
    if (type === 'logic.fork') return '3 parallel branches';
    if (type === 'logic.delay_until') return config.target_time || '?';
    if (type === 'data.transform') return `${config.target || '?'} = ${(config.expression || '').slice(0, 25)}`;
    if (type === 'data.set_variable') return `vars[${config.name || '?'}]`;
    return '';
}

// ── Render nodes (transform-based positioning) ──
function renderNodes() {
    if (!nodes.length) {
        nodesEl.innerHTML = '';
        wfHint.textContent = 'Add a trigger node to begin';
        wfHint.style.display = 'block';
        return;
    }
    wfHint.style.display = 'none';

    let html = '';
    nodes.forEach(node => {
        const meta = NODE_TYPES[node.type] || {};
        const ports = nodePorts(node);
        const status = (nodeStatuses[node.id] && nodeStatuses[node.id].status) || 'idle';
        const progress = (nodeStatuses[node.id] && nodeStatuses[node.id].progress) || 0;

        let portsHtml = '';
        ports.in.forEach(port => {
            const topPct = portTopPct(ports.in, port);
            portsHtml += `<div class="wf-port wf-port-in"
                data-node-id="${node.id}" data-port="${port}" data-direction="in"
                style="top:${topPct}%;" title="input: ${port}">
                ${ports.in.length > 1 ? `<span class="wf-port-label">${escapeHtml(port)}</span>` : ''}
            </div>`;
        });
        ports.out.forEach(port => {
            const topPct = portTopPct(ports.out, port);
            let color = '#5f8fe0';
            if (port === 'true' || port === 'approved') color = '#4ade80';
            else if (port === 'false' || port === 'rejected') color = '#ef4444';
            else if (port === 'default' || port === 'timeout') color = '#8a9bc0';
            else if (port === 'a' || port === 'b' || port === 'c') color = '#a78bfa';
            portsHtml += `<div class="wf-port wf-port-out"
                data-node-id="${node.id}" data-port="${port}" data-direction="out"
                style="top:${topPct}%; border-color:${color};" title="output: ${port}">
                ${ports.out.length > 1 ? `<span class="wf-port-label">${escapeHtml(port)}</span>` : ''}
            </div>`;
        });

        html += `<div class="wf-node ${status} ${selectedNodeId === node.id ? 'selected' : ''}"
                      data-node-id="${node.id}"
                      style="transform: translate3d(${node.x}px, ${node.y}px, 0);
                             border-left-color: ${meta.color || '#5f8fe0'};">
            ${portsHtml}
            <div class="wf-node-header">
                <i class="fas ${meta.icon || 'fa-cog'}" style="color:${meta.color || '#5f8fe0'};"></i>
                <span>${escapeHtml(meta.label || node.type)}</span>
            </div>
            <div class="wf-node-body">${escapeHtml(nodeSummary(node.type, node.config))}</div>
            ${status === 'running' ? `<div class="wf-node-progress"><div class="wf-node-progress-bar" style="width:${progress}%; background:linear-gradient(90deg,${meta.color || '#5f8fe0'},#a5c0ff);"></div></div>` : ''}
        </div>`;
    });
    nodesEl.innerHTML = html;
    attachNodeEvents();
}

// ── Render wires (full rebuild — only on structural change) ──
function renderWires() {
    let html = '';
    edges.forEach((edge, idx) => {
        const from = nodeById(edge.from);
        const to = nodeById(edge.to);
        if (!from || !to) return;
        const fromPort = edge.from_port || 'out';
        const p1 = portWorldPos(from, fromPort, 'out');
        const p2 = portWorldPos(to, 'in', 'in');
        if (!p1 || !p2) return;

        let color = NODE_TYPES[from.type]?.color || '#5f8fe0';
        if (fromPort === 'true' || fromPort === 'approved') color = '#4ade80';
        else if (fromPort === 'false' || fromPort === 'rejected') color = '#ef4444';
        else if (fromPort === 'default' || fromPort === 'timeout') color = '#8a9bc0';
        else if (['a', 'b', 'c'].includes(fromPort)) color = '#a78bfa';

        const d = wirePath(p1.x, p1.y, p2.x, p2.y);
        html += `<g class="wf-wire-group" data-edge-idx="${idx}">
            <path class="wf-wire-hit" d="${d}"></path>
            <path class="wf-wire-visible" d="${d}" stroke="${color}"></path>
        </g>`;
    });
    wiresEl.innerHTML = html;
    wiresEl.querySelectorAll('.wf-wire-hit').forEach(hit => {
        hit.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(hit.parentElement.dataset.edgeIdx);
            if (confirm('Delete this connection?')) {
                edges.splice(idx, 1);
                rebuildEdgeAdjacency();
                markDirty();
                renderAll();
            }
        });
    });
}

// ── Inspector ──
function renderInspector() {
    if (!selectedNodeId) {
        inspectorEl.innerHTML = `<div style="font-size: 0.8rem; color: #6b7a9c;
            text-align: center; padding: 1.5rem 0.5rem;">
            Click a node to configure
        </div>`;
        return;
    }
    const node = nodeById(selectedNodeId);
    if (!node) { inspectorEl.innerHTML = ''; return; }
    const meta = NODE_TYPES[node.type] || {};

    let html = `<div class="wf-inspector-title" style="color:${meta.color || '#5f8fe0'};">
        <i class="fas ${meta.icon || 'fa-cog'}"></i>
        ${escapeHtml(meta.label || node.type)}
    </div>`;
    html += `<div class="wf-inspector-desc">${escapeHtml(meta.description || '')}</div>`;
    html += renderFields(node, meta.fields || []);

    if (meta.advanced_fields && meta.advanced_fields.length) {
        html += `<div class="wf-advanced-toggle" id="wfAdvToggle">
            <i class="fas fa-chevron-right"></i> Advanced
        </div>
        <div class="wf-advanced-fields" id="wfAdvFields">`;
        html += renderFields(node, meta.advanced_fields);
        html += `</div>`;
    }

    if (!node.type.startsWith('trigger.')) {
        html += `<button class="wf-test-node-btn" id="wfTestSelectedNode">
            <i class="fas fa-vial"></i> Test this node
        </button>`;
    }
    html += `<button class="wf-delete-node-btn" id="wfDeleteSelectedNode">
        <i class="fas fa-trash-alt"></i> Delete node
    </button>`;

    inspectorEl.innerHTML = html;

    inspectorEl.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', () => {
            const field = el.dataset.field;
            if (!node.config) node.config = {};
            if (el.type === 'checkbox') node.config[field] = el.checked;
            else if (el.type === 'number') {
                const n = parseFloat(el.value);
                node.config[field] = isNaN(n) ? el.value : n;
            } else node.config[field] = el.value;
            markDirty();
            scheduleRenderNodes();
        });
    });

    const advToggle = document.getElementById('wfAdvToggle');
    if (advToggle) {
        advToggle.addEventListener('click', () => {
            const f = document.getElementById('wfAdvFields');
            f.classList.toggle('open');
            advToggle.querySelector('i').className = f.classList.contains('open')
                ? 'fas fa-chevron-down' : 'fas fa-chevron-right';
        });
    }
    document.getElementById('wfDeleteSelectedNode')
        ?.addEventListener('click', () => deleteNode(selectedNodeId));
    document.getElementById('wfTestSelectedNode')
        ?.addEventListener('click', () => testSelectedNode());
}

function renderFields(node, fields) {
    let html = '';
    fields.forEach(field => {
        const val = (node.config && node.config[field.name] !== undefined)
            ? node.config[field.name]
            : (field.default !== undefined ? field.default : '');

        if (field.type === 'checkbox') {
            html += `<label class="wf-field wf-field-check">
                <input type="checkbox" data-field="${field.name}" ${val ? 'checked' : ''}>
                <span class="wf-field-label" style="margin:0;">${escapeHtml(field.label)}</span>
            </label>`;
            if (field.help) html += `<div class="wf-field-help" style="margin-bottom:0.6rem;">${escapeHtml(field.help)}</div>`;
            return;
        }
        if (field.type === 'select') {
            html += `<label class="wf-field">
                <span class="wf-field-label">${escapeHtml(field.label)}</span>
                <select data-field="${field.name}">`;
            (field.options || []).forEach(opt => {
                html += `<option value="${escapeHtml(opt)}" ${String(opt) === String(val) ? 'selected' : ''}>${escapeHtml(opt)}</option>`;
            });
            html += `</select>`;
            if (field.help) html += `<div class="wf-field-help">${escapeHtml(field.help)}</div>`;
            html += `</label>`;
            return;
        }
        if (field.type === 'textarea') {
            html += `<label class="wf-field">
                <span class="wf-field-label">${escapeHtml(field.label)}</span>
                <textarea data-field="${field.name}" rows="5"
                    placeholder="${escapeHtml(field.placeholder || '')}">${escapeHtml(String(val || ''))}</textarea>`;
            if (field.help) html += `<div class="wf-field-help">${escapeHtml(field.help)}</div>`;
            html += `</label>`;
            return;
        }
        html += `<label class="wf-field">
            <span class="wf-field-label">${escapeHtml(field.label)}</span>
            <input type="${field.type || 'text'}" data-field="${field.name}"
                   value="${escapeHtml(String(val || ''))}"
                   placeholder="${escapeHtml(field.placeholder || '')}">
            ${field.help ? `<div class="wf-field-help">${escapeHtml(field.help)}</div>` : ''}
        </label>`;
    });
    return html;
}

function renderAll() {
    renderNodes();
    renderWires();
    rebuildEdgeAdjacency();
    renderInspector();
    if (exportBtn) exportBtn.disabled = !currentWorkflowId;
}

// ── Node events ──
function attachNodeEvents() {
    nodesEl.querySelectorAll('.wf-node').forEach(el => {
        const nodeId = el.dataset.nodeId;
        const node = nodeById(nodeId);
        if (!node) return;

        el.addEventListener('mousedown', (e) => {
            if (e.target.closest('.wf-port')) return;
            if (e.button !== 0) return;
            e.stopPropagation();
            mode = 'node-down';
            dragStart = { x: e.clientX, y: e.clientY,
                          nodeStartX: node.x, nodeStartY: node.y,
                          nodeId };
            dragOffset = { x: 0, y: 0 };
        });

        el.addEventListener('click', (e) => {
            if (e.target.closest('.wf-port')) return;
            if (mode !== 'idle' && mode !== 'node-down') return;
            if (dragOffset.x === 0 && dragOffset.y === 0) {
                selectedNodeId = nodeId;
                renderAll();
            }
        });
    });

    nodesEl.querySelectorAll('.wf-port-out').forEach(port => {
        port.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            if (e.button !== 0) return;
            const nodeId = port.dataset.nodeId;
            const portName = port.dataset.port;
            const node = nodeById(nodeId);
            if (!node) return;
            const pos = portWorldPos(node, portName, 'out');
            if (!pos) return;
            wireSource = { nodeId, port: portName, x: pos.x, y: pos.y };
            mode = 'dragging-wire';
            viewport.classList.add('wire-mode');
            nodesEl.querySelectorAll('.wf-port-in').forEach(p => p.classList.add('drop-target'));
            wireTempEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            wireTempEl.setAttribute('class', 'wf-wire-temp');
            wiresEl.appendChild(wireTempEl);
        });
    });
}

// ── Viewport events ──
viewport.addEventListener('mousedown', (e) => {
    if (e.button === 1 || (e.button === 0 && e.target === viewport)) {
        mode = 'panning';
        dragStart = { x: e.clientX, y: e.clientY, panX, panY };
        viewport.classList.add('panning');
        e.preventDefault();
    } else if (e.target === viewport || e.target === world || e.target === svg) {
        selectedNodeId = null;
        renderAll();
    }
});

viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

document.addEventListener('mousemove', (e) => {
    if (mode === 'node-down') {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
            mode = 'dragging-node';
            const el = nodesEl.querySelector(`[data-node-id="${dragStart.nodeId}"]`);
            if (el) {
                el.classList.add('dragging');
                draggedNodeEl = el;
            }
        }
    }

    if (mode === 'dragging-node') {
        const node = nodeById(dragStart.nodeId);
        if (!node) return;
        const dx = (e.clientX - dragStart.x) / zoom;
        const dy = (e.clientY - dragStart.y) / zoom;
        node.x = dragStart.nodeStartX + dx;
        node.y = dragStart.nodeStartY + dy;

        // Compositor-only transform update (no layout)
        if (draggedNodeEl) {
            draggedNodeEl.style.transform =
                `translate3d(${node.x}px, ${node.y}px, 0)`;
        }

        // Only update wires connected to this node
        updateConnectedWires(node.id);

        dragOffset = { x: dx, y: dy };
    }

    if (mode === 'dragging-wire' && wireSource && wireTempEl) {
        const w = screenToWorld(e.clientX, e.clientY);
        wireTempEl.setAttribute('d', wirePath(wireSource.x, wireSource.y, w.x, w.y));
        nodesEl.querySelectorAll('.wf-port-in.drop-target').forEach(p => p.classList.remove('drop-target'));
        const hit = portUnderCursor(e.clientX, e.clientY);
        if (hit && hit.dataset.nodeId !== wireSource.nodeId) {
            hit.classList.add('drop-target');
        }
    }

    if (mode === 'panning') {
        panX = dragStart.panX + (e.clientX - dragStart.x);
        panY = dragStart.panY + (e.clientY - dragStart.y);
        applyTransform();
    }
});

document.addEventListener('mouseup', (e) => {
    if (mode === 'node-down') {
        selectedNodeId = dragStart.nodeId;
        renderAll();
    } else if (mode === 'dragging-node') {
        if (draggedNodeEl) draggedNodeEl.classList.remove('dragging');
        draggedNodeEl = null;
        if (dragOffset.x !== 0 || dragOffset.y !== 0) markDirty();
        dragOffset = { x: 0, y: 0 };
    } else if (mode === 'dragging-wire') {
        const hit = portUnderCursor(e.clientX, e.clientY);
        if (hit) {
            const toId = hit.dataset.nodeId;
            if (toId !== wireSource.nodeId) {
                createEdge(wireSource.nodeId, wireSource.port, toId);
            }
        }
        if (wireTempEl && wireTempEl.parentNode) wireTempEl.remove();
        wireTempEl = null;
        wireSource = null;
        nodesEl.querySelectorAll('.wf-port-in').forEach(p => p.classList.remove('drop-target'));
        viewport.classList.remove('wire-mode');
        renderAll();
    } else if (mode === 'panning') {
        viewport.classList.remove('panning');
    }
    mode = 'idle';
});

function portUnderCursor(clientX, clientY) {
    const ports = nodesEl.querySelectorAll('.wf-port-in');
    for (const port of ports) {
        const r = port.getBoundingClientRect();
        if (Math.hypot(clientX - (r.left + r.width / 2),
                       clientY - (r.top + r.height / 2)) < 28) return port;
    }
    return null;
}

function createEdge(fromId, fromPort, toId) {
    edges = edges.filter(e => !(e.from === fromId && (e.from_port || 'out') === fromPort));
    const toNode = nodeById(toId);
    if (toNode && toNode.type !== 'logic.merge') {
        edges = edges.filter(e => e.to !== toId);
    }
    edges.push({ from: fromId, from_port: fromPort, to: toId });
    rebuildEdgeAdjacency();
    markDirty();
}

// ── Node CRUD ──
function addNodeFromPalette(type) {
    if (!NODE_TYPES[type]) return;
    if (type.startsWith('trigger.') && nodes.some(n => n.type.startsWith('trigger.'))) {
        showToast('Only one trigger allowed', true);
        return;
    }
    if (!type.startsWith('trigger.') && !nodes.some(n => n.type.startsWith('trigger.'))) {
        showToast('Add a trigger first', true);
        return;
    }
    const meta = NODE_TYPES[type];
    const config = {};
    (meta.fields || []).forEach(f => {
        if (f.default !== undefined) config[f.name] = f.default;
    });
    (meta.advanced_fields || []).forEach(f => {
        if (f.default !== undefined) config[f.name] = f.default;
    });

    const center = worldCenterOfViewport();
    const jitter = nodes.length * 25;
    const node = {
        id: newId(), type, config,
        x: center.x + jitter - 60,
        y: center.y + jitter - 30,
    };
    nodes.push(node);
    selectedNodeId = node.id;

    if (nodes.length >= 2 && !type.startsWith('trigger.')) {
        const trigger = nodes.find(n => n.type.startsWith('trigger.'));
        if (trigger && !edges.some(e => e.from === trigger.id) && nodes.length === 2) {
            edges.push({ from: trigger.id, from_port: 'out', to: node.id });
            rebuildEdgeAdjacency();
        }
    }
    markDirty();
    renderAll();
}

function deleteNode(nodeId) {
    if (!nodeId) return;
    if (!confirm('Delete this node and its connections?')) return;
    nodes = nodes.filter(n => n.id !== nodeId);
    edges = edges.filter(e => e.from !== nodeId && e.to !== nodeId);
    if (selectedNodeId === nodeId) selectedNodeId = null;
    rebuildEdgeAdjacency();
    markDirty();
    renderAll();
}

async function testSelectedNode() {
    const node = nodeById(selectedNodeId);
    if (!node) return;
    if (node.type.startsWith('trigger.')) {
        showToast('Cannot test a trigger node', true);
        return;
    }
    const testBtn = document.getElementById('wfTestSelectedNode');
    if (testBtn) {
        testBtn.disabled = true;
        testBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Testing…';
    }
    try {
        const r = await fetch('/workflow/test_node', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                type: node.type, config: node.config || {}, dry_run: true,
            }),
        });
        const data = await r.json();
        if (data.status === 'ok') {
            showToast(`Test OK — ports: ${(data.output_ports || []).join(', ')}`);
        } else {
            showToast('Test failed: ' + (data.error || 'unknown'), true);
        }
        if (data.logs && data.logs.length) {
            wfLog.innerHTML = '';
            data.logs.forEach(appendLogEntry);
        }
    } catch (e) {
        showToast('Test error: ' + e.message, true);
    } finally {
        if (testBtn) {
            testBtn.disabled = false;
            testBtn.innerHTML = '<i class="fas fa-vial"></i> Test this node';
        }
    }
}

document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!selectedNodeId) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteNode(selectedNodeId);
    }
});

// ── Autosave ──
function markDirty() {
    isDirty = true;
    updateToolbarState();
    scheduleAutosave();
}

function scheduleAutosave() {
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(async () => {
        if (!isDirty || isSaving || runningTaskId) return;
        if (mode !== 'idle') { scheduleAutosave(); return; }
        if (!nodes.length) return;
        if (!nodes.some(n => n.type.startsWith('trigger.'))) return;
        await saveWorkflow(true);
    }, AUTOSAVE_DELAY_MS);
}

function cancelAutosave() {
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
}

function updateToolbarState() {
    if (!wfStatus) return;
    const nameStr = wfName.value || '(unnamed)';
    let s = '';
    if (runningTaskId) s = '● Running';
    else if (isSaving) s = '● Saving…';
    else if (isDirty) s = '● Unsaved';
    else if (currentWorkflowId) s = '● Saved';
    wfStatus.textContent = nameStr + (s ? '  ·  ' + s : '');
    wfStatus.style.color = runningTaskId ? '#5f8fe0'
                        : isSaving ? '#22d3ee'
                        : isDirty ? '#f59e0b'
                        : '#8a9bc0';
    if (exportBtn) exportBtn.disabled = !currentWorkflowId;
}

function updateResumeButton() {
    if (!resumeBtn) return;
    if (failedTaskId && !runningTaskId) {
        resumeBtn.style.display = '';
        resumeBtn.disabled = false;
    } else {
        resumeBtn.style.display = 'none';
        resumeBtn.disabled = true;
    }
}

// ── Save / Load ──
async function loadWorkflowList() {
    try {
        const r = await fetch('/workflow/list', { cache: 'no-store' });
        const list = await r.json();
        let html = '<option value="">— Load workflow —</option>';
        list.forEach(wf => {
            html += `<option value="${escapeHtml(wf.id)}">${escapeHtml(wf.name)} (${wf.node_count} nodes)</option>`;
        });
        wfSelect.innerHTML = html;
        if (currentWorkflowId) wfSelect.value = currentWorkflowId;
    } catch (e) { console.error(e); }
}

async function loadWorkflow(id) {
    if (!id) return;
    try {
        const r = await fetch(`/workflow/get/${id}`, { cache: 'no-store' });
        if (!r.ok) { showToast('Failed to load', true); return; }
        const wf = await r.json();
        currentWorkflowId = wf.id;
        wfName.value = wf.name || '';
        nodes = wf.nodes || [];
        edges = wf.edges || [];
        selectedNodeId = null;
        nodeStatuses = {};
        isDirty = false;
        cancelAutosave();
        try { localStorage.setItem('wf_last_id', wf.id); } catch (e) {}
        panX = 0; panY = 0; zoom = 1;
        applyTransform();
        renderAll();
        updateToolbarState();
    } catch (e) {
        showToast('Failed to load: ' + e.message, true);
    }
}

async function saveWorkflow(silent = false) {
    if (!nodes.length) {
        if (!silent) showToast('Add nodes before saving', true);
        return false;
    }
    if (!wfName.value.trim()) {
        wfName.value = 'Workflow ' +
            new Date().toLocaleTimeString().replace(/:/g, '');
    }
    const payload = {
        id: currentWorkflowId || undefined,
        name: wfName.value || 'Untitled',
        nodes: nodes.map(n => ({
            id: n.id, type: n.type, config: n.config || {},
            x: Math.round(n.x), y: Math.round(n.y),
        })),
        edges: edges.map(e => ({
            from: e.from, from_port: e.from_port || 'out', to: e.to,
        })),
    };
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
    isSaving = true;
    updateToolbarState();

    try {
        const r = await fetch('/workflow/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Save failed');
        currentWorkflowId = data.id;
        try { localStorage.setItem('wf_last_id', data.id); } catch (e) {}
        isDirty = false;
        isSaving = false;
        updateToolbarState();

        if (silent) {
            wfStatus.textContent =
                (wfName.value || 'Untitled') + '  ·  ✓ Saved';
            wfStatus.style.color = '#4ade80';
            setTimeout(() => { if (!isDirty) updateToolbarState(); }, 1500);
        } else {
            showToast('Workflow saved');
            await loadWorkflowList();
        }
        return true;
    } catch (e) {
        isSaving = false;
        updateToolbarState();
        if (!silent) showToast(e.message, true);
        else {
            wfStatus.textContent =
                (wfName.value || 'Untitled') + '  ·  ⚠️ Save failed';
            wfStatus.style.color = '#ff8a8a';
        }
        return false;
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save';
    }
}

// ── Run / Stop ──
async function runWorkflow(dryRun) {
    if (runningTaskId) return;
    if (!nodes.length) { showToast('Empty workflow', true); return; }
    if (!nodes.some(n => n.type.startsWith('trigger.'))) {
        showToast('Need a trigger', true); return;
    }
    if (nodes.length < 2) { showToast('Add at least one action', true); return; }

    if (isDirty || !currentWorkflowId) {
        const ok = await saveWorkflow(true);
        if (!ok) { showToast('Cannot run: save failed', true); return; }
    }

    const payload = {
        id: currentWorkflowId || undefined,
        name: wfName.value || 'Untitled',
        nodes: nodes.map(n => ({
            id: n.id, type: n.type, config: n.config || {},
            x: Math.round(n.x), y: Math.round(n.y),
        })),
        edges: edges.map(e => ({
            from: e.from, from_port: e.from_port || 'out', to: e.to,
        })),
        dry_run: !!dryRun,
    };

    try {
        const r = await fetch('/workflow/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Run failed');
        runningTaskId = data.task_id;
        try { localStorage.setItem('wf_last_task_id', runningTaskId); } catch (e) {}
        nodeStatuses = {};
        wfLog.innerHTML = '';
        runBtn.disabled = true;
        dryRunBtn.disabled = true;
        stopBtn.style.display = '';
        failedTaskId = null;
        try { localStorage.removeItem('wf_failed_task_id'); } catch (e) {}
        updateResumeButton();
        updateToolbarState();
        renderAll();
        startStream(runningTaskId);
    } catch (e) {
        showToast(e.message, true);
    }
}

async function stopWorkflow() {
    if (!runningTaskId) return;
    try {
        await fetch(`/cancel/${runningTaskId}`, { method: 'POST' });
        showToast('Cancellation requested');
    } catch (e) { showToast('Failed: ' + e.message, true); }
}

// ═══════════════════════════════════════════════════════════
// SSE — the modern replacement for polling
// ═══════════════════════════════════════════════════════════
function stopStream() {
    if (streamSource) {
        try { streamSource.close(); } catch (e) {}
        streamSource = null;
    }
}

function startStream(taskId) {
    stopStream();
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }

    let lastLogTs = 0;
    let lastStatusesJSON = '';
    let lastAwaitingJSON = '';
    let consecutiveErrors = 0;

    function handleUpdate(t) {
        // Node statuses
        const statusesJSON = JSON.stringify(t.node_statuses || {});
        if (statusesJSON !== lastStatusesJSON) {
            lastStatusesJSON = statusesJSON;
            nodeStatuses = t.node_statuses || {};
            scheduleRenderNodes();
        }

        // Logs — append only newer entries
        const logs = t.logs || [];
        for (const entry of logs) {
            const ts = entry.ts || 0;
            if (ts > lastLogTs) {
                appendLogEntry(entry);
                lastLogTs = ts;
            }
        }

        // Awaiting input
        const awaitingJSON = JSON.stringify(t.awaiting_input || null);
        if (awaitingJSON !== lastAwaitingJSON) {
            lastAwaitingJSON = awaitingJSON;
            updateAwaitingUI(taskId, t.awaiting_input);
        }

        // Status line
        if (t.status === 'running') {
            const idx = (t.current_item_index || 0) + 1;
            const total = t.total_items || 0;
            const prefix = t.dry_run ? '[DRY] ' : '';
            const done = t.completed_count || 0;
            const doneStr = done > 0 ? ` · ${done} done` : '';
            const resumeStr = (t.resume_attempts || 0) > 0
                ? ` (resume #${t.resume_attempts})` : '';
            wfStatus.textContent =
                `${prefix}● Running · item ${idx}/${total}${doneStr}${resumeStr}`;
            wfStatus.style.color = '#5f8fe0';
        } else if (t.status === 'done') {
            wfStatus.textContent = (t.dry_run ? '[DRY] ' : '') + '✅ Complete';
            wfStatus.style.color = '#4ade80';
            runningTaskId = null;
            hideAwaitingUI();
            try { localStorage.removeItem('wf_last_task_id'); } catch (e) {}
            resetRunButtons();
        } else if (t.status === 'error') {
            const item = (t.failed_item_index != null)
                ? ` at item ${t.failed_item_index + 1}/${t.total_items}`
                : '';
            wfStatus.textContent = '❌ Failed' + item + ' · click Resume';
            wfStatus.style.color = '#ff8a8a';
            runningTaskId = null;
            hideAwaitingUI();
            failedTaskId = taskId;
            try { localStorage.setItem('wf_failed_task_id', taskId); } catch (e) {}
            try { localStorage.removeItem('wf_last_task_id'); } catch (e) {}
            resetRunButtons();
        } else if (t.status === 'cancelled') {
            wfStatus.textContent = '⛔ Cancelled';
            wfStatus.style.color = '#f59e0b';
            runningTaskId = null;
            hideAwaitingUI();
            try { localStorage.removeItem('wf_last_task_id'); } catch (e) {}
            resetRunButtons();
        }
    }

    function connect() {
        try {
            streamSource = new EventSource(`/workflow/stream/${taskId}`);
        } catch (e) {
            console.error('EventSource construct failed:', e);
            startPollingFallback(taskId);
            return;
        }

        streamSource.onopen = () => { consecutiveErrors = 0; };

        streamSource.onmessage = (ev) => {
            try {
                const t = JSON.parse(ev.data);
                handleUpdate(t);
            } catch (e) {
                console.error('SSE parse error', e);
            }
        };

        streamSource.addEventListener('close', (ev) => {
            try {
                if (ev.data) {
                    const t = JSON.parse(ev.data);
                    handleUpdate(t);
                }
            } catch (e) {}
            stopStream();
        });

        streamSource.addEventListener('error', () => {
            consecutiveErrors++;
            if (consecutiveErrors >= 2) {
                console.warn('SSE failed, falling back to polling');
                stopStream();
                startPollingFallback(taskId);
            }
        });
    }

    connect();
}

// ═══════════════════════════════════════════════════════════
// Polling fallback (only used if SSE is blocked by a proxy)
// ═══════════════════════════════════════════════════════════
function startPollingFallback(taskId) {
    if (pollInterval) clearInterval(pollInterval);
    let lastLogTs = 0;
    let lastStatusesJSON = '';
    let lastAwaitingJSON = '';

    const tick = async () => {
        try {
            const r = await fetch(`/workflow/progress_lite/${taskId}`,
                                   { cache: 'no-store' });
            if (r.status === 404) {
                clearInterval(pollInterval);
                runningTaskId = null;
                resetRunButtons();
                return;
            }
            const t = await r.json();
            const statusesJSON = JSON.stringify(t.node_statuses || {});
            if (statusesJSON !== lastStatusesJSON) {
                lastStatusesJSON = statusesJSON;
                nodeStatuses = t.node_statuses || {};
                scheduleRenderNodes();
            }
            for (const entry of (t.logs || [])) {
                if ((entry.ts || 0) > lastLogTs) {
                    appendLogEntry(entry);
                    lastLogTs = entry.ts;
                }
            }
            const awaitingJSON = JSON.stringify(t.awaiting_input || null);
            if (awaitingJSON !== lastAwaitingJSON) {
                lastAwaitingJSON = awaitingJSON;
                updateAwaitingUI(taskId, t.awaiting_input);
            }
            if (t.status === 'running') {
                const idx = (t.current_item_index || 0) + 1;
                const total = t.total_items || 0;
                wfStatus.textContent = `● Running · item ${idx}/${total}`;
                wfStatus.style.color = '#5f8fe0';
            } else if (t.status === 'done' || t.status === 'error' || t.status === 'cancelled') {
                clearInterval(pollInterval);
                runningTaskId = null;
                if (t.status === 'error') {
                    failedTaskId = taskId;
                    try { localStorage.setItem('wf_failed_task_id', taskId); } catch (e) {}
                }
                hideAwaitingUI();
                try { localStorage.removeItem('wf_last_task_id'); } catch (e) {}
                resetRunButtons();
            }
        } catch (e) { console.error('Poll error:', e); }
    };
    tick();
    pollInterval = setInterval(tick, 2500);
}

function updateAwaitingUI(taskId, awaiting) {
    const card = document.getElementById('wfAwaitingCard');
    const msg = document.getElementById('wfAwaitingMessage');
    if (!awaiting) { hideAwaitingUI(); return; }
    card.style.display = 'block';
    msg.textContent = awaiting.message || 'Approve?';
    card.dataset.taskId = taskId;
}

function hideAwaitingUI() {
    document.getElementById('wfAwaitingCard').style.display = 'none';
}

document.getElementById('wfApproveBtn').addEventListener('click', () => respondToInput('approve'));
document.getElementById('wfRejectBtn').addEventListener('click', () => respondToInput('reject'));

async function respondToInput(response) {
    const card = document.getElementById('wfAwaitingCard');
    const taskId = card.dataset.taskId;
    if (!taskId) return;
    try {
        await fetch(`/workflow/input/${taskId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ response }),
        });
        showToast(response === 'approve' ? 'Approved' : 'Rejected');
    } catch (e) { showToast('Failed: ' + e.message, true); }
}

function resetRunButtons() {
    runBtn.disabled = false;
    dryRunBtn.disabled = false;
    stopBtn.style.display = 'none';
    updateResumeButton();
    updateToolbarState();
}

function appendLogEntry(entry) {
    const emoji = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' }[entry.level] || '•';
    const ts = new Date((entry.ts || 0) * 1000).toLocaleTimeString();
    const line = document.createElement('div');
    line.className = 'wf-log-line ' + (entry.level || 'info');
    line.innerHTML = `<span class="wf-log-ts">${ts}</span>${emoji} ${escapeHtml(entry.msg)}`;
    wfLog.appendChild(line);
    wfLog.scrollTop = wfLog.scrollHeight;
}

async function loadExistingRun(taskId) {
    try {
        const r = await fetch(`/workflow/progress_lite/${taskId}`);
        if (!r.ok) {
            try { localStorage.removeItem('wf_last_task_id'); } catch (e) {}
            return;
        }
        const t = await r.json();
        nodeStatuses = t.node_statuses || {};
        (t.logs || []).forEach(appendLogEntry);
        wfLog.scrollTop = wfLog.scrollHeight;
        scheduleRenderNodes();
        if (t.awaiting_input) updateAwaitingUI(taskId, t.awaiting_input);
        if (t.status === 'running') {
            runningTaskId = taskId;
            runBtn.disabled = true;
            dryRunBtn.disabled = true;
            stopBtn.style.display = '';
            startStream(taskId);
        } else if (t.status === 'error') {
            failedTaskId = taskId;
            try { localStorage.setItem('wf_failed_task_id', taskId); } catch (e) {}
            const item = (t.failed_item_index != null)
                ? ` at item ${t.failed_item_index + 1}/${t.total_items}`
                : '';
            wfStatus.textContent = '❌ Failed' + item + ' · click Resume';
            wfStatus.style.color = '#ff8a8a';
            updateResumeButton();
        }
    } catch (e) { console.error(e); }
}

// ── Context inspector ──
document.getElementById('wfContextBtn').addEventListener('click', async () => {
    const panel = document.getElementById('wfContextPanel');
    if (panel.style.display === 'block') {
        panel.style.display = 'none';
        return;
    }
    if (!runningTaskId) {
        panel.style.display = 'block';
        panel.textContent = 'No active workflow';
        return;
    }
    try {
        const r = await fetch(`/workflow/context/${runningTaskId}`);
        const data = await r.json();
        panel.style.display = 'block';
        panel.textContent = JSON.stringify(data, null, 2);
    } catch (e) { panel.textContent = 'Error: ' + e.message; }
});

// ── Toolbar wiring ──
wfSelect.addEventListener('change', () => {
    if (isDirty && !confirm('Discard unsaved changes?')) {
        wfSelect.value = currentWorkflowId || '';
        return;
    }
    cancelAutosave();
    const id = wfSelect.value;
    if (!id) {
        currentWorkflowId = null;
        wfName.value = '';
        nodes = []; edges = [];
        selectedNodeId = null;
        nodeStatuses = {};
        isDirty = false;
        panX = 0; panY = 0; zoom = 1;
        applyTransform();
        try { localStorage.removeItem('wf_last_id'); } catch (e) {}
        renderAll();
        updateToolbarState();
        return;
    }
    loadWorkflow(id);
});

wfName.addEventListener('input', markDirty);

$('wfNewBtn').addEventListener('click', () => {
    if (isDirty && !confirm('Discard unsaved changes?')) return;
    currentWorkflowId = null;
    wfName.value = '';
    nodes = []; edges = [];
    selectedNodeId = null;
    nodeStatuses = {};
    isDirty = false;
    cancelAutosave();
    panX = 0; panY = 0; zoom = 1;
    applyTransform();
    try { localStorage.removeItem('wf_last_id'); } catch (e) {}
    wfSelect.value = '';
    wfLog.innerHTML = '<div class="empty-state">Not running</div>';
    renderAll();
    updateToolbarState();
});

saveBtn.addEventListener('click', () => saveWorkflow(false));
runBtn.addEventListener('click', () => runWorkflow(false));
dryRunBtn.addEventListener('click', () => runWorkflow(true));
stopBtn.addEventListener('click', stopWorkflow);
$('wfClearLogBtn').addEventListener('click', () => {
    wfLog.innerHTML = '<div class="empty-state">Cleared</div>';
});

exportBtn.addEventListener('click', () => {
    if (!currentWorkflowId) return;
    window.open(`/workflow/export/${currentWorkflowId}`, '_blank');
});

importBtn.addEventListener('click', () => importInput.click());
importInput.addEventListener('change', async () => {
    const f = importInput.files[0];
    if (!f) return;
    try {
        const text = await f.text();
        const data = JSON.parse(text);
        const r = await fetch('/workflow/import', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        const result = await r.json();
        if (!r.ok) throw new Error(result.error || 'Import failed');
        showToast(`Imported: ${result.name}`);
        await loadWorkflowList();
        await loadWorkflow(result.id);
    } catch (e) {
        showToast('Import failed: ' + e.message, true);
    } finally { importInput.value = ''; }
});

resumeBtn.addEventListener('click', async () => {
    if (!failedTaskId || runningTaskId) return;
    if (isDirty && currentWorkflowId) {
        const ok = await saveWorkflow(true);
        if (!ok) { showToast('Cannot resume: save failed', true); return; }
    }
    resumeBtn.disabled = true;
    resumeBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Resuming…';
    try {
        const r = await fetch(`/workflow/resume/${failedTaskId}`, { method: 'POST' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Resume failed');
        failedTaskId = null;
        try { localStorage.removeItem('wf_failed_task_id'); } catch (e) {}
        runningTaskId = data.task_id;
        try { localStorage.setItem('wf_last_task_id', runningTaskId); } catch (e) {}
        nodeStatuses = {};
        wfLog.innerHTML = '';
        runBtn.disabled = true;
        dryRunBtn.disabled = true;
        stopBtn.style.display = '';
        updateResumeButton();
        updateToolbarState();
        renderAll();
        startStream(runningTaskId);
        let msg = `Resumed: ${data.completed_items}/${data.total_items} ` +
                  `already done (attempt ${data.resume_attempts})`;
        if (data.graph_changed) {
            const stats = data.checkpoint_stats || {};
            msg += ` — workflow changed (${stats.dropped_partial || 0} dropped)`;
        }
        showToast(msg);
    } catch (e) {
        showToast('Resume failed: ' + e.message, true);
    } finally {
        resumeBtn.innerHTML = '<i class="fas fa-redo"></i> Resume';
        updateResumeButton();
    }
});

$('wfZoomIn').addEventListener('click', () => {
    const r = viewport.getBoundingClientRect();
    zoomAt(1.2, r.left + r.width / 2, r.top + r.height / 2);
});
$('wfZoomOut').addEventListener('click', () => {
    const r = viewport.getBoundingClientRect();
    zoomAt(1 / 1.2, r.left + r.width / 2, r.top + r.height / 2);
});
$('wfZoomReset').addEventListener('click', () => {
    panX = 0; panY = 0; zoom = 1;
    applyTransform();
});

// ── Cleanup on unload ──
window.addEventListener('beforeunload', () => {
    stopStream();
    if (pollInterval) clearInterval(pollInterval);
});

// ── Init ──
(async () => {
    try {
        const r = await fetch('/workflow/node-types', { cache: 'no-store' });
        NODE_TYPES = await r.json();
    } catch (e) {
        wfHint.textContent = 'Failed to load workflow engine';
        return;
    }
    renderPalette();
    applyTransform();
    await loadWorkflowList();

    let lastId = null;
    try { lastId = localStorage.getItem('wf_last_id'); } catch (e) {}
    if (lastId) await loadWorkflow(lastId);
    else { renderAll(); updateToolbarState(); }

    let lastTaskId = null;
    try { lastTaskId = localStorage.getItem('wf_last_task_id'); } catch (e) {}
    if (lastTaskId) await loadExistingRun(lastTaskId);

    let storedFailed = null;
    try { storedFailed = localStorage.getItem('wf_failed_task_id'); } catch (e) {}
    if (storedFailed && !runningTaskId) {
        try {
            const r = await fetch(`/workflow/resume/info/${storedFailed}`,
                                   { cache: 'no-store' });
            if (r.ok) {
                const info = await r.json();
                if (info.resumable && info.status === 'error') {
                    failedTaskId = storedFailed;
                    const item = (info.failed_item_index != null)
                        ? ` at item ${info.failed_item_index + 1}/${info.total_items}`
                        : '';
                    wfStatus.textContent = '❌ Failed' + item +
                        ` (${info.completed_items}/${info.total_items} done)` +
                        ' · click Resume';
                    wfStatus.style.color = '#ff8a8a';
                } else {
                    try { localStorage.removeItem('wf_failed_task_id'); } catch (e) {}
                }
            }
        } catch (e) {
            try { localStorage.removeItem('wf_failed_task_id'); } catch (e) {}
        }
        updateResumeButton();
    }
})();

})();
</script>
