<div class="card">
    <h2><i class="fas fa-closed-captioning"></i> Subtitle Finder</h2>
    <p>Search for subtitles by movie name and language. Downloads directly to your computer.</p>
    <div class="input-group">
        <input type="text" id="subtitleQuery" placeholder="Movie name (e.g., Inception, The Matrix)" autocomplete="off">
        <select id="subtitleLanguage">
            <option value="eng">English</option>
            <option value="spa">Spanish</option>
            <option value="fra">French</option>
            <option value="deu">German</option>
            <option value="ita">Italian</option>
            <option value="por">Portuguese</option>
            <option value="rus">Russian</option>
            <option value="jpn">Japanese</option>
            <option value="kor">Korean</option>
            <option value="zho">Chinese</option>
            <option value="ara">Arabic</option>
            <option value="hin">Hindi</option>
            <option value="tur">Turkish</option>
            <option value="nld">Dutch</option>
            <option value="pol">Polish</option>
            <option value="swe">Swedish</option>
            <option value="nor">Norwegian</option>
            <option value="dan">Danish</option>
            <option value="fin">Finnish</option>
            <option value="heb">Hebrew</option>
        </select>
        <button id="searchSubtitlesBtn" class="primary"><i class="fas fa-search"></i> Search</button>
    </div>
    <div id="subtitleStatus" class="help-text" style="margin-bottom: 1rem;"></div>
    <div id="subtitleResults" class="file-grid empty-state">No results yet. Enter a movie name and click Search.</div>
</div>

<script>
(function() {
    const searchBtn = document.getElementById('searchSubtitlesBtn');
    const queryInput = document.getElementById('subtitleQuery');
    const langSelect = document.getElementById('subtitleLanguage');
    const statusDiv = document.getElementById('subtitleStatus');
    const resultsDiv = document.getElementById('subtitleResults');

    let currentTaskId = null;
    let pollInterval = null;

    // Helper to escape HTML (in case global escapeHtml is missing)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Helper to show toast (if global showToast missing)
    function showToast(msg, isErr) {
        if (typeof window.showToast === 'function') {
            window.showToast(msg, isErr);
        } else {
            alert((isErr ? 'Error: ' : '') + msg);
        }
    }

    searchBtn.addEventListener('click', async function() {
        const query = queryInput.value.trim();
        if (!query) {
            showToast('Enter a movie name', true);
            return;
        }
        const lang = langSelect.value;

        try {
            const resp = await fetch('/subtitle/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `query=${encodeURIComponent(query)}&language=${lang}`
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            currentTaskId = data.task_id;
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Searching for subtitles...';
            resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Please wait...</div>';
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(pollSubtitleTask, 1500);
        } catch (err) {
            showToast(err.message, true);
        }
    });

    async function pollSubtitleTask() {
        if (!currentTaskId) return;
        try {
            const resp = await fetch(`/progress/${currentTaskId}`);
            const task = await resp.json();
            if (task.error) {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">Error: ${task.error}</span>`;
                resultsDiv.innerHTML = '<div class="empty-state">Search failed.</div>';
                return;
            }
            if (task.status === 'search_done') {
                clearInterval(pollInterval);
                displaySubtitles(task.subtitles || []);
                statusDiv.innerHTML = `✅ Found ${task.subtitles?.length || 0} subtitles. Click Download to save to your PC.`;
            } else if (task.status === 'error') {
                clearInterval(pollInterval);
                statusDiv.innerHTML = `<span style="color:#ff8a8a;">❌ Error: ${task.error_msg}</span>`;
                resultsDiv.innerHTML = '<div class="empty-state">Search failed.</div>';
            } else {
                statusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Searching...`;
            }
        } catch (err) {
            console.error(err);
        }
    }

    function displaySubtitles(subtitles) {
        if (!subtitles.length) {
            resultsDiv.innerHTML = '<div class="empty-state">No subtitles found for this movie/language.</div>';
            return;
        }
        let html = '';
        subtitles.forEach(sub => {
            const safeName = escapeHtml(sub.file_name);
            const safeLang = escapeHtml(sub.language);
            html += `<div class="file-card">
                        <div class="file-name">
                            <i class="fas fa-file-alt"></i> ${safeName}
                        </div>
                        <div class="file-size">
                            Language: ${safeLang} | Downloads: ${sub.download_count} | ${sub.size_mb} MB
                        </div>
                        <div class="file-actions">
                            <button class="download-subtitle" data-url="${escapeHtml(sub.url)}" data-name="${safeName}">
                                <i class="fas fa-download"></i> Download to PC
                            </button>
                        </div>
                    </div>`;
        });
        resultsDiv.innerHTML = html;

        // Attach download events
        document.querySelectorAll('.download-subtitle').forEach(btn => {
            btn.addEventListener('click', function() {
                const url = this.dataset.url;
                const name = this.dataset.name;
                if (!url) {
                    showToast('Download URL not available', true);
                    return;
                }
                // Open the direct download endpoint
                window.open(`/subtitle/download_direct?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(name)}`, '_blank');
                showToast(`Downloading: ${name}`);
            });
        });
    }
})();
</script>
