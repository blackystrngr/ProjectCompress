<div class="card">
    <h2><i class="fas fa-network-wired"></i> Proxy Store & Automation</h2>
    <p style="color:#8b9dc3">
        Proxies persist across restarts. Enable continuous mode in
        <b>Settings ⚙</b> for automatic re-fetch / re-test cycles.
    </p>

    <!-- Status bar -->
    <div id="proxyStatusBar" style="display:flex; flex-wrap:wrap; gap:1rem;
         align-items:center; padding:0.7rem 1rem; margin-bottom:1rem;
         background:rgba(20,28,45,0.7); border-radius:1rem;
         border:1px solid #2a3248; font-size:0.82rem;">
        <span><i class="fas fa-circle" id="daemonDot"
              style="color:#6b7280; font-size:0.55rem;"></i>
            <b id="daemonLabel">Stopped</b></span>
        <span>Total: <b id="totalStored">0</b></span>
        <span>Last cycle: <b id="lastCycle">—</b></span>
        <span>Next cycle: <b id="nextRun">—</b></span>
        <button id="fetchNowBtn" class="primary"
                style="margin-left:auto; padding:0.4rem 1rem;">
            <i class="fas fa-play"></i> Fetch Now
        </button>
    </div>

    <!-- Filters -->
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;
                align-items:center;">
        <select id="filterType" style="padding:0.4rem 0.8rem; min-width:120px;">
            <option value="">All types</option>
            <option value="http">HTTP</option>
            <option value="socks4">SOCKS4</option>
            <option value="socks5">SOCKS5</option>
        </select>
        <select id="filterSort" style="padding:0.4rem 0.8rem; min-width:140px;">
            <option value="latency">Sort: Latency</option>
            <option value="recent">Sort: Newest test</option>
            <option value="ip">Sort: IP</option>
            <option value="type">Sort: Type</option>
            <option value="country">Sort: Country</option>
        </select>
        <input type="number" id="filterMinLat" placeholder="min ms"
               style="width:100px;">
        <input type="number" id="filterMaxLat" placeholder="max ms"
               style="width:100px;">
        <input type="text" id="filterCountry" placeholder="country (US, Germany…)"
               style="width:160px;">
        <input type="text" id="filterQuery" placeholder="search IP"
               style="flex:1; min-width:120px;">
        <button id="applyFiltersBtn" class="primary"
                style="padding:0.4rem 1rem;">Apply</button>
        <button id="resetFiltersBtn" style="padding:0.4rem 1rem;">Reset</button>
    </div>

    <!-- Info line -->
    <div id="resultInfo" class="help-text"
         style="margin-bottom:0.6rem;">Loading…</div>

    <!-- Proxy grid -->
    <div id="proxyList" class="file-grid"
         style="max-height:600px; overflow-y:auto;">
        <div class="empty-state">Loading proxies…</div>
    </div>

    <!-- Pagination -->
    <div id="loadMoreWrap" style="text-align:center; margin-top:1rem; display:none;">
        <button id="loadMoreBtn" class="primary">
            <i class="fas fa-plus"></i> Load More
        </button>
        <div id="loadMoreInfo" class="help-text"
             style="margin-top:0.3rem; font-size:0.75rem;"></div>
    </div>

    <!-- Bulk actions -->
    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1rem;">
        <button id="copyAllBtn" style="display:none;">
            <i class="fas fa-copy"></i> Copy All Shown
        </button>
        <button id="downloadTxtBtn">
            <i class="fas fa-download"></i> Download .txt
        </button>
        <button id="openApiBtn">
            <i class="fas fa-code"></i> Open API
        </button>
    </div>
</div>

<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    const PAGE_SIZE = 100;

    let offset = 0;
    let total = 0;
    let items = [];
    let fetching = false;
    let statusTimer = null;

    // ── Helpers ──────────────────────────────────────────────
    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"]/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
        }[m]));
    }
    function fmtAgo(sec) {
        if (!sec || sec < 0) return '—';
        if (sec < 60) return sec + 's ago';
        const m = Math.floor(sec / 60);
        if (m < 60) return m + 'm ago';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h ago';
        return Math.floor(h / 24) + 'd ago';
    }
    function fmtIn(sec) {
        if (!sec || sec <= 0) return '—';
        if (sec < 60) return 'in ' + sec + 's';
        const m = Math.ceil(sec / 60);
        if (m < 60) return 'in ' + m + 'm';
        const h = Math.round(m / 60);
        return 'in ' + h + 'h';
    }
    function latencyColor(ms) {
        if (ms == null) return '#8a9bc0';
        if (ms < 200) return '#4ade80';
        if (ms < 500) return '#facc15';
        if (ms < 1000) return '#f59e0b';
        return '#ef4444';
    }
    function countryFlag(code) {
        if (!code || code.length !== 2) return '';
        const base = 0x1F1E6;
        const points = [...code.toUpperCase()].map(c => base + (c.charCodeAt(0) - 65));
        return String.fromCodePoint(...points);
    }

    // ── Build current filter query string ───────────────────
    function buildQuery() {
        const q = new URLSearchParams();
        const type = $('filterType').value;
        if (type) q.set('type', type);
        const sort = $('filterSort').value;
        if (sort) q.set('sort', sort);
        const mn = parseInt($('filterMinLat').value, 10);
        if (!isNaN(mn)) q.set('min_latency', mn);
        const mx = parseInt($('filterMaxLat').value, 10);
        if (!isNaN(mx)) q.set('max_latency', mx);
        const qs = $('filterQuery').value.trim();
        if (qs) q.set('q', qs);
        const country = $('filterCountry').value.trim();
        if (country) q.set('country', country);
        q.set('limit', PAGE_SIZE);
        q.set('offset', offset);
        return q;
    }

    // ── Fetch proxies ────────────────────────────────────────
    async function loadProxies(reset = false) {
        if (fetching) return;
        fetching = true;
        try {
            if (reset) {
                offset = 0;
                items = [];
                $('proxyList').innerHTML =
                    '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading…</div>';
            }
            const resp = await fetch('/api/proxies?' + buildQuery().toString(),
                                     { cache: 'no-store' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.json();
            total = data.total;
            items = items.concat(data.proxies);
            offset = items.length;
            renderList();
            updateInfo();
        } catch (err) {
            $('proxyList').innerHTML =
                `<div class="empty-state" style="color:#ff8a8a;">
                 Error: ${escapeHtml(err.message)}</div>`;
        } finally {
            fetching = false;
        }
    }

    function renderList() {
        if (!items.length) {
            $('proxyList').innerHTML =
                '<div class="empty-state">No proxies match the current filters. '
                + 'Click <b>Fetch Now</b> or enable continuous mode.</div>';
            $('loadMoreWrap').style.display = 'none';
            return;
        }
        let html = '';
        items.forEach(p => {
            const lat = p.latency_ms;
            const lc = latencyColor(lat);
            html += `<div class="file-card">
                <div class="file-name" style="justify-content:space-between;">
                    <span>
                        <i class="fas fa-plug"></i>
                        ${escapeHtml(p.type.toUpperCase())}
                    </span>
                    <span style="font-size:0.72rem; color:${lc};
                                 font-family:monospace; font-weight:700;">
                        ${lat != null ? lat + ' ms' : '—'}
                    </span>
                </div>
                <div class="file-size"
                     style="font-family:monospace; word-break:break-all;">
                    ${escapeHtml(p.ip)}:${p.port}
                </div>
                <div class="file-size" style="font-size:0.72rem; color:#a0aec0;">
                    ${countryFlag(p.country_code)} ${escapeHtml(p.country || 'Unknown')}
                </div>
                <div class="file-size" style="display:flex; gap:0.6rem;
                     align-items:center; font-size:0.7rem;">
                    <span style="color:#a5f3c5;">✓ ${p.success_count || 0}</span>
                    <span style="color:#ff8a8a;">✗ ${p.fail_count || 0}</span>
                    <span style="color:#6b7280;">tested ${fmtAgo(p.age_sec)}</span>
                </div>
                <div class="file-actions">
                    <button class="copy-one"
                            data-url="${escapeHtml(p.url)}">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                    <button class="retest-one"
                            data-ip="${escapeHtml(p.ip)}"
                            data-port="${p.port}"
                            data-type="${escapeHtml(p.type)}">
                        <i class="fas fa-vial"></i> Re-test
                    </button>
                </div>
            </div>`;
        });
        $('proxyList').innerHTML = html;

        $('proxyList').querySelectorAll('.copy-one').forEach(btn => {
            btn.onclick = () => {
                navigator.clipboard.writeText(btn.dataset.url);
                showToast?.('Copied');
            };
        });
        $('proxyList').querySelectorAll('.retest-one').forEach(btn => {
            btn.onclick = async () => {
                const orig = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
                try {
                    const r = await fetch('/proxy/test_single', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            ip: btn.dataset.ip,
                            port: parseInt(btn.dataset.port, 10),
                            type: btn.dataset.type,
                        }),
                    });
                    const d = await r.json();
                    if (d.success) {
                        showToast?.(`OK · ${d.latency_ms} ms`);
                        // Refresh row + bump into store
                        loadProxies(true);
                    } else {
                        showToast?.('Proxy failed', true);
                    }
                } catch (e) {
                    showToast?.(e.message, true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                }
            };
        });
    }

    function updateInfo() {
        const shown = items.length;
        $('resultInfo').textContent =
            `Showing ${shown} of ${total} proxies`
            + (total > shown ? ' — click Load More' : '');
        if (total > shown) {
            $('loadMoreWrap').style.display = 'block';
            $('loadMoreInfo').textContent =
                `${total - shown} more available`;
            $('copyAllBtn').style.display = 'inline-block';
        } else {
            $('loadMoreWrap').style.display = 'none';
            $('copyAllBtn').style.display = shown ? 'inline-block' : 'none';
        }
        $('downloadTxtBtn').style.display = total > 0 ? 'inline-block' : 'none';
    }

    // ── Status polling ──────────────────────────────────────
    async function pollStatus() {
        try {
            const r = await fetch('/proxy/status', { cache: 'no-store' });
            if (!r.ok) return;
            const s = await r.json();

            // Daemon state
            const dot = $('daemonDot');
            const lbl = $('daemonLabel');
            if (s.continuous_enabled && s.daemon_alive) {
                dot.style.color = s.running ? '#f59e0b' : '#4ade80';
                lbl.textContent = s.running ? 'Running cycle…' : 'Continuous';
            } else if (s.continuous_enabled) {
                dot.style.color = '#f59e0b';
                lbl.textContent = 'Starting…';
            } else {
                dot.style.color = '#6b7280';
                lbl.textContent = 'Stopped';
            }

            $('totalStored').textContent = s.total_stored || 0;

            if (s.last_cycle_end) {
                const ago = Math.floor(Date.now() / 1000) - s.last_cycle_end;
                const stats = (s.last_cycle_tested || 0) + ' tested · '
                            + (s.last_cycle_found || 0) + ' working · '
                            + fmtAgo(ago);
                $('lastCycle').textContent = stats;
            } else {
                $('lastCycle').textContent = '—';
            }

            if (s.next_run_at && s.continuous_enabled) {
                const inSec = Math.max(0, s.next_run_at - Math.floor(Date.now() / 1000));
                $('nextRun').textContent = fmtIn(inSec);
            } else {
                $('nextRun').textContent = '—';
            }

            // If a cycle just finished, refresh the list
            if (!s.running && window._wasRunning) {
                loadProxies(true);
            }
            window._wasRunning = !!s.running;
        } catch (e) { /* silent */ }
    }

    // ── Fetch Now ───────────────────────────────────────────
    $('fetchNowBtn').onclick = async () => {
        $('fetchNowBtn').disabled = true;
        $('fetchNowBtn').innerHTML =
            '<i class="fas fa-spinner fa-pulse"></i> Starting…';
        try {
            const r = await fetch('/proxy/fetch', { method: 'POST' });
            const d = await r.json();
            if (d.error) throw new Error(d.error);
            showToast?.('Fetch cycle started');
            // Auto-refresh after a delay so results appear
            setTimeout(() => loadProxies(true), 8000);
        } catch (e) {
            showToast?.(e.message, true);
        } finally {
            $('fetchNowBtn').disabled = false;
            $('fetchNowBtn').innerHTML =
                '<i class="fas fa-play"></i> Fetch Now';
        }
    };

    // ── Filters ─────────────────────────────────────────────
    function applyFilters() { loadProxies(true); }
    $('applyFiltersBtn').onclick = applyFilters;
    $('filterType').onchange = applyFilters;
    $('filterSort').onchange = applyFilters;
    $('filterQuery').addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFilters();
    });
    $('filterCountry').addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFilters();
    });
    $('resetFiltersBtn').onclick = () => {
        $('filterType').value = '';
        $('filterSort').value = 'latency';
        $('filterMinLat').value = '';
        $('filterMaxLat').value = '';
        $('filterCountry').value = '';
        $('filterQuery').value = '';
        applyFilters();
    };

    // ── Pagination ──────────────────────────────────────────
    $('loadMoreBtn').onclick = () => loadProxies(false);

    // ── Bulk actions ────────────────────────────────────────
    $('copyAllBtn').onclick = () => {
        const text = items.map(p => p.url).join('\n');
        navigator.clipboard.writeText(text)
            .then(() => showToast?.(`Copied ${items.length} proxy line(s)`))
            .catch(err => showToast?.(err.message, true));
    };
    $('downloadTxtBtn').onclick = () => {
        window.open('/api/proxies.txt', '_blank');
    };
    $('openApiBtn').onclick = () => {
        window.open('/api/proxies?limit=100&sort=latency', '_blank');
    };

    // ── Init ────────────────────────────────────────────────
    loadProxies(true);
    pollStatus();
    statusTimer = setInterval(pollStatus, 3000);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) pollStatus();
    });

    // Cleanup when tab switches away
    window.addEventListener('beforeunload', () => {
        if (statusTimer) clearInterval(statusTimer);
    });
})();
</script>
