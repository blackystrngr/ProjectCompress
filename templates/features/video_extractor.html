<div class="card">
    <h2><i class="fas fa-magnifying-glass"></i> Video URL Extractor</h2>
    <p>Extract direct video links from any webpage.</p>
    <div class="input-group">
        <input type="text" id="extractorUrl" placeholder="https://example.com/video-page">
        <label><input type="checkbox" id="useYtdlpCheckbox" checked> Advanced (yt-dlp)</label>
        <button id="extractBtn" class="primary">Extract</button>
    </div>
    <div id="extractStatus" class="help-text"></div>
    <div id="extractResults" class="file-grid empty-state">Enter a webpage URL and click Extract.</div>
</div>

<script>
let currentExtractTaskId = null, extractPollInterval = null;
const extractBtn = document.getElementById('extractBtn'), urlInput = document.getElementById('extractorUrl'), ytdlpCheck = document.getElementById('useYtdlpCheckbox');
const statusDiv = document.getElementById('extractStatus'), resultsDiv = document.getElementById('extractResults');

extractBtn.onclick = async () => {
    let url = urlInput.value.trim();
    if (!url) { showToast('Enter a webpage URL', true); return; }
    if (!url.startsWith('http')) url = 'https://' + url;
    const useYtdlp = ytdlpCheck.checked;
    try {
        const resp = await fetch('/extract/fetch', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `url=${encodeURIComponent(url)}&use_ytdlp=${useYtdlp}`
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        currentExtractTaskId = data.task_id;
        statusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Extracting... (${useYtdlp ? 'advanced' : 'standard'})`;
        resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Please wait...</div>';
        if (extractPollInterval) clearInterval(extractPollInterval);
        extractPollInterval = setInterval(pollExtract, 1500);
    } catch (err) { showToast(err.message, true); }
};

async function pollExtract() {
    if (!currentExtractTaskId) return;
    try {
        const resp = await fetch(`/extract/results/${currentExtractTaskId}`);
        const data = await resp.json();
        if (data.error) {
            clearInterval(extractPollInterval);
            statusDiv.innerHTML = `<span style="color:#ff8a8a;">Error: ${data.error}</span>`;
            resultsDiv.innerHTML = '<div class="empty-state">Extraction failed.</div>';
            return;
        }
        if (data.status === 'done') {
            clearInterval(extractPollInterval);
            displayExtractedUrls(data.video_urls, data.combined_url);
            statusDiv.innerHTML = `✅ Found ${data.count} URL(s).`;
        } else if (data.status === 'error') {
            clearInterval(extractPollInterval);
            statusDiv.innerHTML = `❌ Error: ${data.error_msg}`;
            resultsDiv.innerHTML = '<div class="empty-state">Extraction failed.</div>';
        } else {
            let msg = data.status === 'ytdlp_extract' ? 'Running yt-dlp...' : 'Processing...';
            statusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> ${msg}`;
        }
    } catch (err) { console.error(err); }
}

function displayExtractedUrls(urls, combinedUrl) {
    if (!urls || !urls.length) { resultsDiv.innerHTML = '<div class="empty-state">No direct video URLs found. Try enabling Advanced (yt-dlp).</div>'; return; }
    let html = '';
    if (combinedUrl) {
        html += `<div class="file-card" style="border-color:#4caf50; background:rgba(76,175,80,0.1);">
                    <div class="file-name"><i class="fas fa-check-circle" style="color:#4caf50;"></i> Best Quality (Combined)</div>
                    <div class="file-size" style="word-break:break-all;">${escapeHtml(combinedUrl)}</div>
                    <div class="file-actions">
                        <button class="copy-url" data-url="${escapeHtml(combinedUrl)}"><i class="fas fa-copy"></i> Copy URL</button>
                        <button class="download-extracted-ytdlp" data-url="${escapeHtml(combinedUrl)}"><i class="fas fa-download"></i> Download (yt-dlp)</button>
                    </div>
                </div>`;
    }
    urls.forEach((url, idx) => {
        if (combinedUrl && url === combinedUrl) return;
        const fileName = url.split('/').pop().split('?')[0] || `video_${idx+1}.mp4`;
        html += `<div class="file-card">
                    <div class="file-name"><i class="fas fa-link"></i> ${escapeHtml(fileName)}</div>
                    <div class="file-size" style="word-break:break-all;">${escapeHtml(url)}</div>
                    <div class="file-actions">
                        <button class="copy-url" data-url="${escapeHtml(url)}"><i class="fas fa-copy"></i> Copy URL</button>
                        <button class="download-extracted-ytdlp" data-url="${escapeHtml(url)}"><i class="fas fa-download"></i> Download (yt-dlp)</button>
                    </div>
                </div>`;
    });
    resultsDiv.innerHTML = html;
    document.querySelectorAll('#extractResults .copy-url').forEach(btn => {
        btn.onclick = () => { navigator.clipboard.writeText(btn.dataset.url); showToast('URL copied'); };
    });
    document.querySelectorAll('#extractResults .download-extracted-ytdlp').forEach(btn => {
        btn.onclick = async () => {
            const url = btn.dataset.url;
            const formData = new URLSearchParams();
            formData.append('url', url);
            const resp = await fetch('/extract/download', { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.error) showToast(data.error, true);
            else showToast(`Download started: ${data.task_id}`);
            fetchTasks();
        };
    });
}
</script>
